<title>Touch Grass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap">
<style>
/* One full-screen meadow; the few controls float over it like seed heads. */
:root {
  --meadow: #20351a;      /* page ground behind the canvas, the meadow's shade */
  --dusk: #0d160b;        /* the start screen's veil */
  --pollen: #f6e7b4;      /* light, text on the meadow */
  --pollen-dim: rgba(246, 231, 180, 0.62);
  --glass: rgba(14, 24, 12, 0.42);
  --glass-edge: rgba(246, 231, 180, 0.18);
  --font-title: "Comfortaa", "Nunito Sans", ui-rounded, system-ui, sans-serif;
  --font-ui: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--meadow);
  color: var(--pollen);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#start {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 60%, rgba(13, 22, 11, 0.35), rgba(13, 22, 11, 0.82));
  transition: opacity 0.9s ease;
}
#start.gone { opacity: 0; pointer-events: none; }
.start-card { display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 30rem; }
.start-card h1 {
  margin: 0; font-family: var(--font-title); font-weight: 600;
  font-size: clamp(2.4rem, 9vw, 4.2rem); letter-spacing: 0.02em; line-height: 1;
  text-wrap: balance;
}
.start-card p { margin: 0; color: var(--pollen-dim); font-size: 1rem; line-height: 1.5; text-wrap: balance; }
#begin {
  font: 600 1.05rem var(--font-ui); color: var(--dusk);
  background: var(--pollen); border: 0; border-radius: 999px;
  padding: 14px 34px; cursor: pointer; letter-spacing: 0.03em;
}
#begin:focus-visible, .chip:focus-visible { outline: 2px solid var(--pollen); outline-offset: 3px; }
#start .note { font-size: 0.82rem; color: var(--pollen-dim); }

#controls {
  position: fixed; z-index: 4;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
}
.chip {
  font: 600 0.85rem var(--font-ui); color: var(--pollen);
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#timerow {
  display: flex; align-items: center; gap: 10px;
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px;
  padding: 6px 14px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-variant-numeric: tabular-nums; font-size: 0.85rem;
}
#hour { width: min(46vw, 200px); accent-color: var(--pollen); }

#plates { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.plate-name {
  position: absolute; left: calc(14px + env(safe-area-inset-left, 0px));
  transform: translateY(-50%);
  font-family: var(--font-title); font-size: clamp(0.95rem, 3.2vw, 1.35rem); font-weight: 600;
  text-shadow: 0 1px 6px rgba(10, 20, 6, 0.6);
  opacity: 0;
}
#hint {
  position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px);
  font-size: 0.9rem; color: var(--pollen-dim); text-align: center; text-shadow: 0 1px 6px rgba(10, 20, 6, 0.7);
  transition: opacity 1.5s ease; pointer-events: none;
}
#err { position: fixed; inset: auto 16px 16px 16px; z-index: 6; color: var(--pollen); font-size: 0.9rem; }
@media (prefers-reduced-motion: reduce) { #start, #hint { transition: none; } }
</style>

<div id="stage"></div>
<div id="plates"></div>
<div id="controls" hidden>
  <button class="chip" id="view" type="button">Vy: Ovanifrån</button>
  <button class="chip" id="clock" type="button">Tid 15:00</button>
  <div id="timerow" hidden>
    <label for="hour">Tid</label>
    <input id="hour" type="range" min="0" max="24" step="0.05" value="15">
  </div>
</div>
<div id="hint" hidden></div>
<div id="start">
  <div class="start-card">
    <h1>Touch Grass</h1>
    <p>Dra fingrarna över ängen. Höjden på skärmen väljer ackord, i sidled knäpper du strängarna. Låt fingret ligga kvar så sjunker det djupare i gräset och klangen ljusnar.</p>
    <button id="begin" type="button">Börja</button>
    <span class="note">Fmaj7 · Am7 · Cmaj7 · Em7 · G, uppifrån och ner</span>
  </div>
</div>
<div id="err" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*ENGINE*/
</script>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Touch Grass for phones. A port of the Godot app (touchgrass/): the meadow,
// the five strum plates and Chordtroller's Omnichord engine, played by touch.
// Every finger is a hand: its height picks the plate, its sideways sweep
// plucks the strings, and the grass parts round it.
// ---------------------------------------------------------------------------

const CHORDS = [[5, 3, "Fmaj7"], [9, 4, "Am7"], [0, 3, "Cmaj7"], [4, 4, "Em7"], [7, 0, "G"]];
const PLATE_COLORS = [[1.0, 0.78, 0.32], [1.0, 0.58, 0.45], [0.95, 0.5, 0.75], [0.62, 0.56, 1.0], [0.45, 0.75, 1.0]];
const STRING_LEFT = 0.04, STRING_RIGHT = 0.96, REARM = 0.33, BAND_HYST = 0.18;
const FIELD_LIMIT = 19;          // metres from the middle the blades reach
const BEND_SIZE = 40;            // metres the bend and ripple fields cover, centred on the origin
const GRASS_TOP = 0.55;          // where a finger meets the grass

const VIEWS = [
  { name: "Ovanifrån",       pos: [0.4, 12.0, 2.4], look: [0, 0, -0.2], fov: 50 },
  { name: "Snett ovanifrån", pos: [2.6, 9.4, 5.6],  look: [-0.3, 0, -0.6], fov: 52 },
  { name: "Diagonalt",       pos: [6.2, 8.8, 6.2],  look: [-0.8, 0, -0.8], fov: 52 },
];

const E = TouchGrassEngine();
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function showError(text) { const e = $("err"); e.textContent = text; e.hidden = false; }

// ---- renderer ----------------------------------------------------------------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
} catch (e) {
  showError("Den här webbläsaren kan inte visa WebGL, så ängen kan inte ritas.");
  throw e;
}
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let pixelRatio = Math.min(DPR, 1.6);
renderer.setPixelRatio(pixelRatio);
$("stage").appendChild(renderer.domElement);
const gl = renderer.getContext();
const floatTargets = !!(renderer.capabilities.isWebGL2 &&
  (gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float")));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 400);

// ---- noise texture: world-space colour patches and the wind's gusts ----------
// r dry patches, g lushness, b fine variation, a gusts. Periodic, so it tiles
// every 64 m without a seam.
function noiseTexture(size) {
  function lattice(period, seed) {
    const v = new Float32Array(period * period);
    let s = seed >>> 0;
    for (let i = 0; i < v.length; i++) { s = (s * 1664525 + 1013904223) >>> 0; v[i] = s / 4294967296; }
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), w = fy * fy * (3 - 2 * fy);
      const at = (i, j) => v[((j % period + period) % period) * period + ((i % period + period) % period)];
      return lerp(lerp(at(xi, yi), at(xi + 1, yi), u), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), u), w);
    };
  }
  function fbm(base, octaves, seed) {
    const layers = [];
    for (let o = 0; o < octaves; o++) layers.push(lattice(base << o, seed + o * 977));
    return (x, y) => {
      let s = 0, a = 0.5, n = 0;
      for (let o = 0; o < octaves; o++) { s += a * layers[o](x * (base << o), y * (base << o)); n += a; a *= 0.5; }
      return s / n;
    };
  }
  const dry = fbm(2, 3, 11), lush = fbm(4, 3, 23), fine = fbm(16, 2, 37), gust = fbm(4, 3, 51);
  const data = new Uint8Array(size * size * 4);
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
    const x = i / size, y = j / size, k = (j * size + i) * 4;
    data[k] = dry(x, y) * 255; data[k + 1] = lush(x, y) * 255;
    data[k + 2] = fine(x, y) * 255; data[k + 3] = gust(x, y) * 255;
  }
  const t = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}
const noiseTex = noiseTexture(256);

// ---- full-screen passes for the bend and ripple fields -----------------------
const passScene = new THREE.Scene();
const passCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const passQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
passScene.add(passQuad);
const PASS_VERT = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";

function target(size) {
  return new THREE.WebGLRenderTarget(size, size, {
    type: floatTargets ? THREE.HalfFloatType : THREE.UnsignedByteType,
    format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: false, stencilBuffer: false,
  });
}

// Where the grass has been touched. Never cleared: each frame every texel is
// pulled back toward rest (at least one 8-bit step, so it cannot stall where
// half floats are missing), then the fingers are stamped on top. So the
// blades part round a finger and the wake behind it closes over seconds.
const MAX_TOUCH = 10;
let bendA = target(384), bendB = target(384);
const bendMat = new THREE.ShaderMaterial({
  vertexShader: PASS_VERT,
  uniforms: {
    uPrev: { value: null }, uDecay: { value: 0.02 }, uCount: { value: 0 },
    uTouch: { value: Array.from({ length: MAX_TOUCH }, () => new THREE.Vector4()) },
    uDrag: { value: Array.from({ length: MAX_TOUCH }, () => new THREE.Vector4()) },
    uRect: { value: new THREE.Vector3(-BEND_SIZE / 2, -BEND_SIZE / 2, BEND_SIZE) },
    uInit: { value: 1 },
  },
  fragmentShader: `
    uniform sampler2D uPrev; uniform float uDecay; uniform int uCount; uniform float uInit;
    uniform vec4 uTouch[${MAX_TOUCH}]; uniform vec4 uDrag[${MAX_TOUCH}]; uniform vec3 uRect;
    varying vec2 vUv;
    void main() {
      vec3 rest = vec3(0.5, 0.5, 0.0);
      vec3 c = mix(texture2D(uPrev, vUv).rgb, rest, uInit);
      vec3 d = c - rest;
      vec3 back = d * uDecay;
      vec3 minStep = sign(d) * min(abs(d), vec3(1.2 / 255.0));
      c -= mix(minStep, back, step(abs(minStep), abs(back)));
      vec2 w = uRect.xy + vUv * uRect.z;
      for (int i = 0; i < ${MAX_TOUCH}; i++) {
        if (i >= uCount) break;
        vec2 o = w - uTouch[i].xy;
        float dist = length(o);
        float r = dist / uTouch[i].z;
        float fall = 1.0 - smoothstep(0.0, 1.0, r);
        if (fall <= 0.0) continue;
        vec2 radial = dist > 1e-3 ? o / dist : vec2(0.0);
        vec2 push = clamp(radial * smoothstep(0.0, 0.4, r) * 0.75 + uDrag[i].xy * 0.7, -1.0, 1.0);
        vec3 stamp = vec3(0.5 + 0.5 * push, uTouch[i].w * fall);
        c = mix(c, stamp, fall * uDrag[i].z);
      }
      gl_FragColor = vec4(c, 1.0);
    }`,
});

// Rings from plucked strings, drawn fresh each frame: rgb their light,
// a how hard they bow the blades as they pass.
const MAX_RIPPLE = 16;
const rippleRT = target(256);
const rippleMat = new THREE.ShaderMaterial({
  vertexShader: PASS_VERT,
  uniforms: {
    uRings: { value: Array.from({ length: MAX_RIPPLE }, () => new THREE.Vector4()) },
    uColors: { value: Array.from({ length: MAX_RIPPLE }, () => new THREE.Vector3()) },
    uRect: { value: new THREE.Vector3(-BEND_SIZE / 2, -BEND_SIZE / 2, BEND_SIZE) },
  },
  fragmentShader: `
    uniform vec4 uRings[${MAX_RIPPLE}]; uniform vec3 uColors[${MAX_RIPPLE}]; uniform vec3 uRect;
    varying vec2 vUv;
    void main() {
      vec2 w = uRect.xy + vUv * uRect.z;
      vec3 glow = vec3(0.0); float bow = 0.0;
      for (int i = 0; i < ${MAX_RIPPLE}; i++) {
        vec4 r = uRings[i];
        if (r.w <= 0.0) continue;
        float ring = (length(w - r.xy) - r.z * 3.2) / 0.6;
        float wave = exp(-ring * ring) * r.w * exp(-r.z / 1.8);
        glow += uColors[i] * wave; bow += wave;
      }
      glow = glow / (1.0 + length(glow));
      gl_FragColor = vec4(glow, clamp(bow, 0.0, 1.0));
    }`,
});

// ---- the meadow --------------------------------------------------------------
const COMMON_GLSL = `
  uniform sampler2D uNoise;
  float dryAt(vec2 xz) { return smoothstep(0.42, 0.66, texture2D(uNoise, xz / 64.0).r); }
  float lushAt(vec2 xz) { return texture2D(uNoise, xz / 64.0 + vec2(0.37, 0.11)).g; }
  vec3 grassLow(vec2 xz) { return mix(vec3(0.018, 0.05, 0.010), vec3(0.11, 0.09, 0.03), dryAt(xz)); }
  vec3 grassHigh(vec2 xz) {
    vec3 green = mix(vec3(0.20, 0.36, 0.03), vec3(0.36, 0.48, 0.045), lushAt(xz));
    return mix(green, vec3(0.56, 0.44, 0.11), dryAt(xz));
  }
  vec3 tonemap(vec3 x) { x *= 0.62; return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
`;

const lightUniforms = {
  uSunDir: { value: new THREE.Vector3(0.3, 0.8, -0.5).normalize() },
  uSunCol: { value: new THREE.Color(1, 0.9, 0.75) },
  uAmbient: { value: new THREE.Color(0.45, 0.52, 0.6) },
  uFogCol: { value: new THREE.Color(0.6, 0.7, 0.75) },
  uFogDensity: { value: 0.012 },
  uWarm: { value: 0.3 },
};

const grassUniforms = Object.assign({
  uNoise: { value: noiseTex },
  uBend: { value: bendA.texture },
  uRipple: { value: rippleRT.texture },
  uRect: { value: new THREE.Vector3(-BEND_SIZE / 2, -BEND_SIZE / 2, BEND_SIZE) },
  uSpacing: { value: 0.08 }, uWidthScale: { value: 1 }, uFieldMin: { value: new THREE.Vector2() },
  uTime: { value: 0 }, uWindDir: { value: new THREE.Vector2(0.8, -0.6).normalize() },
  uWind: { value: 0.45 }, uGustSpeed: { value: 5.0 },
  uMusic: { value: new THREE.Vector3() },
}, lightUniforms);

const grassMat = new THREE.ShaderMaterial({
  uniforms: grassUniforms,
  side: THREE.DoubleSide,
  vertexShader: `
    attribute vec2 aCell;
    uniform sampler2D uBend; uniform sampler2D uRipple; uniform vec3 uRect;
    uniform float uSpacing, uWidthScale, uTime, uWind, uGustSpeed;
    uniform vec2 uFieldMin, uWindDir; uniform vec3 uMusic;
    varying float vT; varying float vGust; varying vec3 vLow; varying vec3 vHigh;
    varying vec3 vGlow; varying vec3 vN; varying vec3 vWorld; varying float vSparkle;
    ${COMMON_GLSL}
    vec4 hash42(vec2 p) {
      vec4 p4 = fract(vec4(p.xyxy) * vec4(0.1031, 0.1030, 0.0973, 0.1099));
      p4 += dot(p4, p4.wzxy + 33.33);
      return fract((p4.xxyz + p4.yzzw) * p4.zywx);
    }
    void main() {
      vec4 h = hash42(aCell + 17.0);
      vec4 h2 = hash42(aCell * 1.618 + 3.0);
      vec2 root = uFieldMin + (aCell + h.xy) * uSpacing;
      float lush = lushAt(root);
      float L = mix(0.42, 1.0, lush) * (0.7 + 0.6 * h.z);
      float yaw = h.w * 6.2831853;
      vec2 face = vec2(cos(yaw), sin(yaw));
      float yaw2 = h2.x * 6.2831853;
      vec2 droop = vec2(cos(yaw2), sin(yaw2)) * mix(0.12, 0.6, h.z * h.z);

      vec2 wd = uWindDir, wp = vec2(-wd.y, wd.x);
      vec2 q = root - wd * uTime * uGustSpeed;
      float n = texture2D(uNoise, q / 100.0).a * 0.65 + texture2D(uNoise, q / 32.0 + vec2(0.3, 0.7)).a * 0.35;
      float g = clamp(smoothstep(0.45, 0.78, n) + uMusic.x * 0.5, 0.0, 1.0);
      float ph = h2.y * 6.2831853;
      float flutter = sin(uTime * (2.2 + h.z * 1.6) + ph + dot(root, wd) * 1.3);
      float flutter2 = sin(uTime * (3.1 + h.z) + ph * 1.7);
      vec2 v = droop + wd * uWind * (0.25 + 1.25 * g) + wd * flutter * 0.07 * (0.4 + g) + wp * flutter2 * 0.05;

      vec2 buv = (root - uRect.xy) / uRect.z;
      float inside = step(0.0, buv.x) * step(buv.x, 1.0) * step(0.0, buv.y) * step(buv.y, 1.0);
      vec4 b = texture2D(uBend, buv);
      vec2 push = (b.rg - 0.5) * 2.0 * inside;
      float press = clamp(b.b, 0.0, 1.0) * inside;
      vec4 rp = texture2D(uRipple, buv) * inside;
      v = v * (1.0 - 0.6 * min(length(push), 1.0)) + push * 1.5;
      float vl = max(length(v), 1e-4);
      float a = min(vl + press * 0.9 + rp.a * 0.7, 1.5);
      vec2 dir = v / vl;

      float t = position.y, s = position.x;
      vec3 hd = vec3(dir.x, 0.0, dir.y);
      vec3 P1 = hd * sin(a) * L * 0.18 + vec3(0.0, L * 0.55, 0.0);
      vec3 P2 = hd * sin(a) * L + vec3(0.0, cos(a) * L, 0.0);
      vec3 pos = 2.0 * (1.0 - t) * t * P1 + t * t * P2;
      vec3 tng = normalize(2.0 * (1.0 - t) * P1 + 2.0 * t * (P2 - P1) + vec3(0.0, 1e-4, 0.0));
      vec3 side = vec3(face.x, 0.0, face.y);
      float w = uSpacing * 0.75 * uWidthScale * (0.75 + 0.5 * h2.z);
      pos += side * s * w * pow(1.0 - t, 0.6);
      vN = normalize(mix(normalize(cross(side, tng)), vec3(0.0, 1.0, 0.0), 0.6));
      vec3 world = vec3(root.x, -0.02, root.y) + pos;
      vWorld = world;
      vT = t; vGust = g;
      vLow = grassLow(root);
      vHigh = grassHigh(root) * (0.85 + 0.3 * h2.w);
      vGlow = rp.rgb;
      vSparkle = uMusic.z * step(0.93, fract(h.z * 37.0 + uTime * 0.7));
      gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity, uWarm;
    varying float vT; varying float vGust; varying vec3 vLow; varying vec3 vHigh;
    varying vec3 vGlow; varying vec3 vN; varying vec3 vWorld; varying float vSparkle;
    vec3 tonemap(vec3 x) { x *= 0.62; return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    void main() {
      vec3 col = mix(vLow, vHigh, smoothstep(0.0, 0.85, vT));
      col *= mix(0.35, 1.0, smoothstep(0.0, 0.55, vT));
      col *= 1.0 + vGust * 0.28 * vT;
      col = mix(col, col * vec3(1.15, 1.0, 0.7), uWarm * vT);
      vec3 n = normalize(gl_FrontFacing ? vN : vN);
      float lam = max(dot(n, uSunDir), 0.0) * 0.6 + 0.4;
      vec3 lit = col * (uAmbient + uSunCol * lam * 1.4) + col * uSunCol * 0.3 * vT;
      lit += vGlow * vT * vT * 0.55 + vec3(1.0, 0.95, 0.8) * vSparkle * vT * vT * 0.8;
      float fog = 1.0 - exp(-uFogDensity * length(vWorld - cameraPosition));
      lit = mix(lit, uFogCol, fog);
      gl_FragColor = vec4(pow(tonemap(lit), vec3(1.0 / 2.2)), 1.0);
    }`,
});

const groundMat = new THREE.ShaderMaterial({
  uniforms: Object.assign({ uNoise: { value: noiseTex }, uFieldMin: grassUniforms.uFieldMin, uFieldMax: { value: new THREE.Vector2() } }, lightUniforms),
  vertexShader: "varying vec3 vWorld; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }",
  fragmentShader: `
    uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity; uniform vec2 uFieldMin, uFieldMax;
    varying vec3 vWorld;
    ${COMMON_GLSL}
    void main() {
      vec2 xz = vWorld.xz;
      float n = texture2D(uNoise, xz / 9.0).b;
      vec3 low = grassLow(xz) * (0.8 + 0.4 * n);
      // past the blades the ground takes the colour of their tips

// One blade: a strip from root (y 0) to tip (y 1), x -0.5..0.5 across.
function bladeGeometry(segments) {
  const pos = [], idx = [];
  for (let k = 0; k < segments; k++) { const t = k / segments; pos.push(-0.5, t, 0, 0.5, t, 0); }
  pos.push(0, 1, 0);
  for (let k = 0; k < segments - 1; k++) { const a = k * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const last = (segments - 1) * 2;
  idx.push(last, segments * 2, last + 1);

  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}

// The field: a grid of cells covering what every view sees, in a shuffled
// order, so drawing fewer blades thins the whole meadow evenly. Blades widen
// as they thin so the meadow stays full.
const MAX_BLADES = 150000;
let budget = 70000;
const bladeGeo = bladeGeometry(4);
const blades = new THREE.Mesh(bladeGeo, grassMat);
blades.frustumCulled = false;
scene.add(blades);
let fieldArea = 1;

function footprint(view, aspect) {
  const cam = new THREE.PerspectiveCamera(view.fov, aspect, 0.1, 100);
  cam.position.set(...view.pos); cam.lookAt(...view.look); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
  const pts = [];
  for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const p = new THREE.Vector3(x, y, 0.5).unproject(cam).sub(cam.position).normalize();
    const t = p.y < -0.05 ? -cam.position.y / p.y : 40;
    const hit = cam.position.clone().addScaledVector(p, Math.min(t, 40));
    pts.push([clamp(hit.x, -FIELD_LIMIT, FIELD_LIMIT), clamp(hit.z, -FIELD_LIMIT, FIELD_LIMIT)]);
  }
  return pts;
}

function buildField() {
  const aspect = window.innerWidth / Math.max(1, window.innerHeight);
  let minX = 1e9, minZ = 1e9, maxX = -1e9, maxZ = -1e9;
  for (const v of VIEWS) for (const [x, z] of footprint(v, aspect)) {
    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
  }
  minX -= 1.5; minZ -= 1.5; maxX += 1.5; maxZ += 1.5;
  const w = maxX - minX, d = maxZ - minZ;
  fieldArea = w * d;
  const spacing = Math.sqrt(fieldArea / MAX_BLADES);
  const nx = Math.ceil(w / spacing), nz = Math.ceil(d / spacing);
  const n = nx * nz;
  const cells = new Float32Array(n * 2);
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) { const k = (j * nx + i) * 2; cells[k] = i; cells[k + 1] = j; }
  let s = 12345;
  for (let k = n - 1; k > 0; k--) {
    s = (s * 1664525 + 1013904223) >>> 0;
    const r = s % (k + 1);
    const ax = cells[2 * k], az = cells[2 * k + 1];
    cells[2 * k] = cells[2 * r]; cells[2 * k + 1] = cells[2 * r + 1];
    cells[2 * r] = ax; cells[2 * r + 1] = az;
  }
  bladeGeo.setAttribute("aCell", new THREE.InstancedBufferAttribute(cells, 2));
  grassUniforms.uSpacing.value = spacing;
  grassUniforms.uFieldMin.value.set(minX, minZ);
  groundMat.uniforms.uFieldMax.value.set(maxX, maxZ);
  bladeGeo.maxCells = n;
  setBudget(budget);
}

function setBudget(b) {
  budget = clamp(Math.round(b), 15000, Math.min(MAX_BLADES, bladeGeo.maxCells || MAX_BLADES));
  bladeGeo.instanceCount = budget;
  grassUniforms.uWidthScale.value = Math.sqrt(MAX_BLADES / budget) * 0.9;
}

function dotTexture() {

const POLLEN = 360;

pollenGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));

function burst(at, rgb, strength) {
  for (let k = 0; k < 14; k++) {
    const i = pollenNext; pollenNext = (pollenNext + 1) % POLLEN;
    const a = Math.random() * Math.PI * 2, r = Math.random() * 0.25;
    pPos[i * 3] = at.x + Math.cos(a) * r; pPos[i * 3 + 1] = GRASS_TOP + Math.random() * 0.2; pPos[i * 3 + 2] = at.z + Math.sin(a) * r;
    pVel[i * 3] = Math.cos(a) * 0.3 * Math.random(); pVel[i * 3 + 1] = 0.25 + 0.5 * Math.random() * strength; pVel[i * 3 + 2] = Math.sin(a) * 0.3 * Math.random();
    pLife[i] = 1.6 + Math.random() * 0.8;

    pCol[i * 3] = lerp(rgb[0], 1, 0.4) * m; pCol[i * 3 + 1] = lerp(rgb[1], 1, 0.4) * m; pCol[i * 3 + 2] = lerp(rgb[2], 0.9, 0.4) * m;

function stepPollen(dt) {
  for (let i = 0; i < POLLEN; i++) {
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt;
    const k = i * 3;
    pVel[k] += 0.15 * dt; pVel[k + 1] += 0.05 * dt; pVel[k + 2] -= 0.08 * dt;
    pVel[k] *= 1 - 0.5 * dt; pVel[k + 1] *= 1 - 0.5 * dt; pVel[k + 2] *= 1 - 0.5 * dt;
    pPos[k] += pVel[k] * dt; pPos[k + 1] += pVel[k + 1] * dt; pPos[k + 2] += pVel[k + 2] * dt;
    const fade = Math.min(1, pLife[i] / 0.8);
    pCol[k] *= fade > 0.999 ? 1 : 0.985; pCol[k + 1] *= fade > 0.999 ? 1 : 0.985; pCol[k + 2] *= fade > 0.999 ? 1 : 0.985;
    if (pLife[i] <= 0) pPos[k + 1] = -100;

// ---- sound ---------------------------------------------------------------------
let ctx = null, node = null, mainEngine = null, analyser = null, freqData = null;

function post(c) {
  if (node && node.port) node.port.postMessage(c);

}

function impulse(ctx, seconds) {
  const len = Math.floor(ctx.sampleRate * seconds), pre = Math.floor(ctx.sampleRate * 0.04);
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    let lp = 0;
    for (let i = pre; i < len; i++) {
      const t = (i - pre) / ctx.sampleRate;
      lp += (0.35 + 0.5 * Math.exp(-t * 2)) * ((Math.random() * 2 - 1) - lp);
      d[i] = lp * Math.exp(-t * 2.4);
    }
  }
  return ir;
}

async function startAudio() {

  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  ctx = new AC({ latencyHint: "interactive" });
  const mobile = /Android|iPhone|iPad/.test(navigator.userAgent);
  const voices = mobile ? 32 : 48;
  let source = null;
  if (ctx.audioWorklet) {
    try {
      const code = "const TouchGrassEngine = " + TouchGrassEngine.toString() + ";\n(" +
        TouchGrassProcessor.toString() + ")(TouchGrassEngine());";
      const url = URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
      await ctx.audioWorklet.addModule(url);
      node = new AudioWorkletNode(ctx, "grass-engine", { numberOfInputs: 0, outputChannelCount: [2], processorOptions: { voices } });
      source = node;
    } catch (e) { node = null; }
  }
  if (!source) {
    // the browser refused the worklet: run the engine on the main thread
    mainEngine = new E.GrassEngine(ctx.sampleRate, voices);
    const sp = ctx.createScriptProcessor(1024, 0, 2);
    sp.onaudioprocess = (ev) => {
      const L = ev.outputBuffer.getChannelData(0), R = ev.outputBuffer.getChannelData(1);
      mainEngine.render(L, R, L.length);
    };

  }

  const dry = ctx.createGain(); dry.gain.value = 0.9;
  const wet = ctx.createGain(); wet.gain.value = 0.32;

  source.connect(reverb).connect(wet).connect(master);
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.6;
  freqData = new Float32Array(analyser.frequencyBinCount);
  master.connect(analyser).connect(ctx.destination);
  if (ctx.state !== "running") await ctx.resume();
  post({ t: "chord", root: CHORDS[2][0], quality: CHORDS[2][1] });
}

function listenToMusic(dt) {
  if (!analyser) return;
  analyser.getFloatFrequencyData(freqData);
  const binHz = ctx.sampleRate / analyser.fftSize;
  const bands = [[40, 250], [250, 2000], [2000, 9000]];
  for (let k = 0; k < 3; k++) {
    const a = Math.max(1, Math.floor(bands[k][0] / binHz)), b = Math.min(freqData.length - 1, Math.ceil(bands[k][1] / binHz));
    let p = 0;
    for (let i = a; i <= b; i++) p += Math.pow(10, freqData[i] / 10);
    const db = 10 * Math.log10(p + 1e-12);
    const now = clamp((db + 70) / 45, 0, 1);
    const key = k === 0 ? "x" : k === 1 ? "y" : "z";
    const rate = now > music[key] ? 0.08 : 0.6;
    music[key] = lerp(music[key], now, 1 - Math.exp(-dt / rate));
  }
  grassUniforms.uMusic.value.copy(music);
}

// ---- fingers on the plates ----------------------------------------------------
// Each finger has its own strum state, as each hand did in the Godot app.
const plates = CHORDS.map((c) => E.plate(c[0], c[1]));

function newFinger(id) {
  const sprite = new THREE.Sprite(glowMat.clone());
  sprite.scale.set(1.1, 1.1, 1);

}

const ray = new THREE.Raycaster();

}

function strum(f, sx, sy, t) {

  const want = Math.floor(band);
  if (f.plate < 0) { f.plate = want; f.prev = -1; }
  else if (want !== f.plate) {
    const into = band - f.plate;
    if (into < -BAND_HYST || into > 1 + BAND_HYST) { f.plate = want; f.prev = -1; f.armed.fill(1); }
  }
  const s = (sx - STRING_LEFT) / (STRING_RIGHT - STRING_LEFT) * (n - 1);
  const dt = Math.max(1e-3, (t - f.last) / 1000);
  if (f.prev < 0) { f.prev = s; f.last = t; return; }
  const moved = s - f.prev;
  f.speed = lerp(f.speed, Math.abs(moved) / dt, 0.25);

    const order = [];
    for (let k = lo; k <= hi; k++) order.push(k);

    for (const k of order) {
      if (Math.abs(k - f.prev) < 1e-6 || !f.armed[k]) continue;
      const vel = clamp(0.3 + 0.3 * clamp(f.speed / 20, 0, 1) + 0.4 * depthFor(f), 0.15, 1);
      post({ t: "pluckNote", note: plates[f.plate][k], vel, delay: 0 });

function onPluck(f, vel) {

// ---- depth: how long a finger has stayed down. A quick sweep stays light

const canvas = renderer.domElement;

canvas.addEventListener("pointerdown", (e) => {
  if (!started) return;

  const f = newFinger(e.pointerId);
  f.downAt = performance.now();

// ---- time of day ---------------------------------------------------------------
const KEYS = [
  { e: -18, hor: [0.035, 0.05, 0.10], light: [0.55, 0.65, 1.0], energy: 0.16, amb: [0.07, 0.09, 0.16], warm: 0.0, fog: 0.03 },
  { e: -5, hor: [0.62, 0.40, 0.40], light: [0.9, 0.5, 0.4], energy: 0.10, amb: [0.20, 0.17, 0.24], warm: 0.2, fog: 0.022 },
  { e: 4, hor: [1.0, 0.70, 0.45], light: [1.0, 0.62, 0.32], energy: 1.1, amb: [0.32, 0.30, 0.34], warm: 0.9, fog: 0.016 },
  { e: 16, hor: [0.90, 0.88, 0.80], light: [1.0, 0.86, 0.66], energy: 1.5, amb: [0.36, 0.42, 0.50], warm: 0.35, fog: 0.012 },
  { e: 45, hor: [0.70, 0.84, 0.97], light: [1.0, 0.96, 0.88], energy: 1.7, amb: [0.40, 0.47, 0.56], warm: 0.0, fog: 0.010 },

let hour = 15;
function sunDirection(h) {

  else a = Math.PI + (((h - 21) % 24 + 24) % 24) / 8 * Math.PI;
  let elev = Math.sin(a) * (Math.sin(a) < 0 ? 18 : 52) * Math.PI / 180;
  const flat = Math.sin(a) < 0 ? new THREE.Vector3(Math.cos(a), 0, Math.sin(a)) : new THREE.Vector3(Math.cos(a), 0, -Math.sin(a));

  if (elev <= KEYS[0].e) k = KEYS[0];
  else for (let i = 1; i < KEYS.length; i++) if (elev <= KEYS[i].e) {
    const a = KEYS[i - 1], b = KEYS[i], t = smooth(a.e, b.e, elev);

  lightUniforms.uSunDir.value.copy(dir);
  lightUniforms.uSunCol.value.setRGB(k.light[0] * k.energy, k.light[1] * k.energy, k.light[2] * k.energy);
  lightUniforms.uAmbient.value.setRGB(...k.amb);
  lightUniforms.uFogCol.value.setRGB(...k.hor);
  lightUniforms.uFogDensity.value = k.fog;
  lightUniforms.uWarm.value = k.warm;
  const fogSrgb = k.hor.map((v) => Math.pow(clamp(v, 0, 1), 1 / 2.2));

// ---- camera views ----------------------------------------------------------------
let viewIndex = 0, glide = 1, from = null, to = null;
function viewState(v) { return { pos: new THREE.Vector3(...v.pos), look: new THREE.Vector3(...v.look), fov: v.fov }; }
function goToView(i, instant) {
  viewIndex = ((i % VIEWS.length) + VIEWS.length) % VIEWS.length;
  from = to ? { pos: camera.position.clone(), look: to.look.clone(), fov: camera.fov } : viewState(VIEWS[viewIndex]);
  to = viewState(VIEWS[viewIndex]);
  if (from && to && glide < 1) from.look = currentLook.clone();
  glide = instant ? 1 : 0;
  $("view").textContent = "Vy: " + VIEWS[viewIndex].name;
}
const currentLook = new THREE.Vector3();
function placeCamera(dt, time) {
  if (glide < 1) glide = Math.min(1, glide + dt / 2.5);
  const e = glide * glide * (3 - 2 * glide);
  const pos = from.pos.clone().lerp(to.pos, e);
  currentLook.copy(from.look).lerp(to.look, e);
  pos.y += Math.sin(e * Math.PI) * 0.12 * from.pos.distanceTo(to.pos);
  pos.add(new THREE.Vector3(Math.sin(time * 0.21), Math.sin(time * 0.17 + 1.3) * 0.6, Math.cos(time * 0.13)).multiplyScalar(0.05));
  camera.fov = lerp(from.fov, to.fov, e);
  camera.position.copy(pos);

}

  clockTime += dt;
  grassUniforms.uTime.value = clockTime;
  placeCamera(dt, clockTime);

  // each finger sinks the longer it stays down
  let deepest = 0;
  for (const f of fingers.values()) {
    f.depth = smooth(0, 1, ((now - f.downAt) / 1000 - SINK_DELAY) / SINK_SECONDS);
    f.speed *= Math.exp(-dt / 0.25);
    deepest = Math.max(deepest, depthFor(f));
  }
  deepestDepth = deepest;
  // the deepest finger sets the strings' tone; with no finger down it holds, so
  // notes still ringing do not change colour as they die
  if (started && fingers.size) {
    const tone = 0.1 + 0.9 * deepest;
    if (Math.abs(tone - lastTone) > 0.01) { lastTone = tone; post({ t: "tone", v: tone }); }
  }

  // stamp the fingers into the bend field
  let n = 0;
  const viewScale = clamp(camera.position.y / 11, 0.6, 1.6);
  for (const f of fingers.values()) {
    if (n >= MAX_TOUCH) break;
    const sp = f.vel.length();
    const drag = sp > 1e-3 ? f.vel.clone().multiplyScalar(clamp(sp / 3, 0, 1) / sp) : new THREE.Vector2();
    bendTouch[n].set(f.world.x, f.world.z, (0.5 + 0.35 * depthFor(f)) * viewScale, 0.15 + 0.85 * depthFor(f));
    bendDrag[n].set(drag.x, drag.y, 0.45, 0);
    f.vel.multiplyScalar(Math.exp(-dt / 0.15));
    f.sprite.position.set(f.world.x, GRASS_TOP + 0.15, f.world.z);
    f.sprite.material.opacity = lerp(f.sprite.material.opacity, 0.25 + 0.6 * depthFor(f), 0.2);
    f.sprite.scale.setScalar((0.6 + 1.1 * depthFor(f)) * viewScale);
    n++;
  }
  bendMat.uniforms.uCount.value = n;
  for (let i = leaving.length - 1; i >= 0; i--) {
    const f = leaving[i];
    f.sprite.material.opacity *= Math.exp(-dt / 0.2);
    if (f.sprite.material.opacity < 0.01) { scene.remove(f.sprite); f.sprite.material.dispose(); leaving.splice(i, 1); }
  }
  bendMat.uniforms.uDecay.value = 1 - Math.exp(-dt / 2.6);
  bendMat.uniforms.uPrev.value = bendA.texture;
  passQuad.material = bendMat;
  renderer.setRenderTarget(bendB);
  renderer.render(passScene, passCam);
  bendMat.uniforms.uInit.value = 0;
  [bendA, bendB] = [bendB, bendA];
  grassUniforms.uBend.value = bendA.texture;

  // ripples
  const rings = rippleMat.uniforms.uRings.value, cols = rippleMat.uniforms.uColors.value;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].age += dt; if (ripples[i].age > 4) ripples.splice(i, 1); }
  for (let i = 0; i < MAX_RIPPLE; i++) {
    const r = ripples[i];
    if (r) { rings[i].set(r.x, r.z, r.age, r.strength); cols[i].set(...r.col); }
    else rings[i].set(0, 0, 0, 0);
  }
  passQuad.material = rippleMat;
  renderer.setRenderTarget(rippleRT);
  renderer.render(passScene, passCam);
  renderer.setRenderTarget(null);

  stepPollen(dt);
  listenToMusic(dt);

  for (let k = 0; k < CHORDS.length; k++) {
    let want = 0;
    for (const f of fingers.values()) if (f.plate === k) want = Math.max(want, 0.25 + 0.6 * Math.exp(-(performance.now() - f.lastPluck) / 500));
    plateGlow[k] = Math.max(0, plateGlow[k] - dt);
    plateAlpha[k] = clamp(lerp(plateAlpha[k], Math.max(want, plateGlow[k] * 0.5), want > plateAlpha[k] ? 0.25 : 0.04), 0, 1);
    plateLabels[k].style.opacity = plateAlpha[k].toFixed(3);
  }

  renderer.render(scene, camera);

  // keep the frame rate: fewer blades on a struggling phone, more on a strong one
  fpsTime += dt; fpsFrames++;
  if (fpsTime > 2.5) {
    const fps = fpsFrames / fpsTime;
    if (tuned < 6) {
      if (fps < 42) { setBudget(budget * 0.7); tuned++; }
      else if (fps > 57 && budget < MAX_BLADES) { setBudget(budget * 1.25); tuned++; }
    }
    window.__tg = { fps: Math.round(fps), blades: budget, worklet: !!node, floatTargets, depth: +deepestDepth.toFixed(2) };
    fpsTime = 0; fpsFrames = 0;
  }
  requestAnimationFrame(frame);
}

// ---- start -----------------------------------------------------------------------
$("begin").addEventListener("click", async () => {
  $("start").classList.add("gone");
  $("controls").hidden = false;
  started = true;
  try { await startAudio(); } catch (e) { showError("Ljudet kunde inte starta: " + e.message); }
  try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}
  const hint = $("hint");
  hint.textContent = "Dra i sidled · höjden byter ackord · låt fingret ligga kvar för djupare klang";
  hint.hidden = false;
  setTimeout(() => { hint.style.opacity = "0"; }, 6500);
});

// A hidden page goes quiet: switching app, locking the phone or leaving the
// tab must not leave the drone playing somewhere unseen.
document.addEventListener("visibilitychange", () => {
  if (!ctx) return;
  if (document.hidden) { post({ t: "alloff" }); ctx.suspend(); dronePlate = -1; }
  else ctx.resume().then(() => { dronePlate = 2; post({ t: "chord", root: CHORDS[2][0], quality: CHORDS[2][1] }); });
});
window.addEventListener("pagehide", () => { if (ctx) ctx.close(); });

$("view").addEventListener("click", () => goToView(viewIndex + 1, false));
$("clock").addEventListener("click", () => { $("timerow").hidden = !$("timerow").hidden; });
$("hour").addEventListener("input", (e) => applyHour(parseFloat(e.target.value)));

goToView(0, true);
applyHour(15);
resize();
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
