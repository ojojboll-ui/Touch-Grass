  });

  // the part of the pond the camera sees, where floaters and fish are kept
  function updateView() {
    const pts = [];
    for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const d = new THREE.Vector3(x, y, 0.5).unproject(camera).sub(camera.position).normalize();
      const t = d.y < -0.05 ? -camera.position.y / d.y : 30;
      const p = camera.position.clone().addScaledVector(d, Math.min(t, 30));
      pts.push(p);
    }
    view.minX = clamp(Math.min(...pts.map((p) => p.x)), -14, 0) + 0.6;
    view.maxX = clamp(Math.max(...pts.map((p) => p.x)), 0, 14) - 0.6;
    view.minZ = clamp(Math.min(...pts.map((p) => p.z)), -14, 0) + 0.6;
    view.maxZ = clamp(Math.max(...pts.map((p) => p.z)), 0, 14) - 0.6;
  }

  function updateArea() {
    // before layout the window can be 0 wide: an aspect of 0 makes every corner NaN
    let aspect = window.innerWidth / Math.max(1, window.innerHeight);
    if (!(aspect > 0.2)) aspect = 0.6;
    let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
    for (const v of VIEWS) {
      const cam = new THREE.PerspectiveCamera(v.fov, aspect, 0.1, 100);
      cam.position.set(...v.pos); cam.lookAt(...v.look); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
      for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        const d = new THREE.Vector3(x, y, 0.5).unproject(cam).sub(cam.position).normalize();
        const t = d.y < -0.05 ? -cam.position.y / d.y : 30;
        const q = cam.position.clone().addScaledVector(d, Math.min(t, 30));
        minX = Math.min(minX, q.x); maxX = Math.max(maxX, q.x); minZ = Math.min(minZ, q.z); maxZ = Math.max(maxZ, q.z);
      }
    }
    area.minX = clamp(minX, -16, 0) + 0.5; area.maxX = clamp(maxX, 0, 16) - 0.5;
    area.minZ = clamp(minZ, -16, 0) + 0.5; area.maxZ = clamp(maxZ, 0, 16) - 0.5;
    for (const f of floaters) if (!Number.isFinite(f.x) || !Number.isFinite(f.z)) {
      f.x = lerp(area.minX, area.maxX, rand()); f.z = lerp(area.minZ, area.maxZ, rand()); f.vx = f.vz = 0;
    }
  }
  updateArea();
  for (const f of floaters) { f.x = lerp(area.minX, area.maxX, rand()); f.z = lerp(area.minZ, area.maxZ, rand()); }

  const kicks = [];         // rings from taps and plucks, pushing floaters and scaring fish
  function stepFloaters(dt, touches, time) {
    for (const f of floaters) {
      const pad = f.kind === "pad";
      const reach = pad ? f.size + 0.55 : 0.6;
      for (const t of touches) {
        const dx = f.x - t.x, dz = f.z - t.z, d = Math.hypot(dx, dz);
        if (d < reach && d > 1e-4) {
          const push = (reach - d) / reach;
          f.vx += (dx / d) * push * 5 * dt + t.dx * push * 3 * dt;
          f.vz += (dz / d) * push * 5 * dt + t.dz * push * 3 * dt;
          f.spin += (dx * t.dz - dz * t.dx) * push * 2 * dt;
        }
      }
      for (const k of kicks) {
        const dx = f.x - k.x, dz = f.z - k.z, d = Math.hypot(dx, dz);
        if (d < 2.5 && d > 1e-4) { const s = k.amount * (1 - d / 2.5) / (pad ? 2.5 : 1); f.vx += (dx / d) * s; f.vz += (dz / d) * s; }
      }
      // a slow drift, as if the pond breathed
      f.vx += Math.sin(f.z * 0.25 + time * 0.07) * 0.012 * dt;
      f.vz += Math.cos(f.x * 0.21 + time * 0.05) * 0.012 * dt;
      // back toward the part of the pond the views see
      if (f.x < area.minX) f.vx += (area.minX - f.x) * 0.6 * dt;
      if (f.x > area.maxX) f.vx -= (f.x - area.maxX) * 0.6 * dt;
      if (f.z < area.minZ) f.vz += (area.minZ - f.z) * 0.6 * dt;
      if (f.z > area.maxZ) f.vz -= (f.z - area.maxZ) * 0.6 * dt;
      const damp = Math.exp(-dt * (pad ? 0.9 : 1.3));
      f.vx *= damp; f.vz *= damp; f.spin *= Math.exp(-dt * 1.5);
      f.x += f.vx * dt; f.z += f.vz * dt; f.rot += f.spin * dt;
    }
    // pads do not overlap
    for (let i = 0; i < padIndex.length; i++) for (let j = i + 1; j < padIndex.length; j++) {
      const a = padIndex[i], b = padIndex[j];
      const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz), min = a.size + b.size;
      if (d < min && d > 1e-4) {
        const p = (min - d) * 0.5, nx = dx / d, nz = dz / d;
        a.x -= nx * p; a.z -= nz * p; b.x += nx * p; b.z += nz * p;
      }
    }
    // leaves and petals nudge each other apart, and each lies at its own height
    // so two that do touch never flicker through each other
    for (let i = 0; i < bitIndex.length; i++) {
      const a = bitIndex[i];
      for (let j = i + 1; j < bitIndex.length; j++) {
        const b = bitIndex[j], dx = b.x - a.x, dz = b.z - a.z, d2 = dx * dx + dz * dz, min = (a.size + b.size) * 0.4;
        if (d2 < min * min && d2 > 1e-8) {
          const d = Math.sqrt(d2), push = (min - d) * 0.25, nx = dx / d, nz = dz / d;
          a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
        }
      }
      let onPad = 0;
      for (const pad of padIndex) if (Math.hypot(a.x - pad.x, a.z - pad.z) < pad.size * 0.95) onPad = 1;
      a.lift = lerp(a.lift || 0, 0.006 + 0.005 * (i % 7) + onPad * 0.035, 0.2);
      bitGeo.attributes.iLook.setW(i, a.lift);
    }
    bitGeo.attributes.iLook.needsUpdate = true;
    const pp = padGeo.attributes.iPose, bp = bitGeo.attributes.iPose, lp = lotusGeo.attributes.iPose;
    padIndex.forEach((f, i) => pp.setXYZW(i, f.x, f.z, f.rot, f.size));
    bitIndex.forEach((f, i) => bp.setXYZW(i, f.x, f.z, f.rot, f.size));
    flowerPads.forEach((pi, i) => { const f = padIndex[pi]; lp.setXYZW(i, f.x + 0.05, f.z - 0.04, f.rot, 0.55 + f.size * 0.5); lotusGeo.attributes.iLook.setW(i, 0.01); });
    lotusGeo.attributes.iLook.needsUpdate = true;
    pp.needsUpdate = true; bp.needsUpdate = true; lp.needsUpdate = true;
  }

  function stepFish(dt, touches, time) {
    for (let i = 0; i < fish.length; i++) {
      const f = fish[i];
      // wander
      f.turn += (Math.sin(time * 0.37 + i * 2.1) * 0.6 + (rand() - 0.5) * 0.8) * dt;
      f.turn *= Math.exp(-dt * 1.2);
      let want = f.a + f.turn;
      let speed = 0.32;
      // curious: a finger resting on the water draws them in, slowly
      for (const t of touches) {
        const dx = t.x - f.x, dz = t.z - f.z, d = Math.hypot(dx, dz);
        if (t.depth > 0.5 && d < 4.5 && d > 0.7) { want = steer(f.a, Math.atan2(dz, dx), 0.5 * dt * 3); speed = 0.25; }
      }
      // a ring nearby: flee
      for (const k of kicks) {
        const dx = f.x - k.x, dz = f.z - k.z, d = Math.hypot(dx, dz);
        if (d < 2.8) { f.flee = 1; f.fx = dx; f.fz = dz; }
      }
      if (f.flee > 0.02) { want = steer(f.a, Math.atan2(f.fz, f.fx), 6 * dt); speed = 0.32 + 1.6 * f.flee; f.flee *= Math.exp(-dt * 1.4); }
      // stay in view
      const cx = (view.minX + view.maxX) / 2, cz = (view.minZ + view.maxZ) / 2;
      if (f.x < view.minX + 0.5 || f.x > view.maxX - 0.5 || f.z < view.minZ + 0.5 || f.z > view.maxZ - 0.5)
        want = steer(want, Math.atan2(cz - f.z, cx - f.x), 1.5 * dt);
      // keep apart
      for (let j = 0; j < fish.length; j++) if (j !== i) {
        const o = fish[j], dx = f.x - o.x, dz = f.z - o.z, d = Math.hypot(dx, dz);
        if (d < 0.8 && d > 1e-4) want = steer(want, Math.atan2(dz, dx), 0.8 * dt);
      }
      // a koi turns no tighter than about half its length: cap the turn rate by speed
      const maxTurn = (0.5 + f.speed * 1.4) * dt;
      let dA = steer(f.a, want, Math.min(1, dt * 2.5)) - f.a;
      f.a += clamp(dA, -maxTurn, maxTurn);
      f.speed = lerp(f.speed, speed, 1 - Math.exp(-dt * 2));
      f.x += Math.cos(f.a) * f.speed * dt;
      f.z += Math.sin(f.a) * f.speed * dt;
      f.phase += dt * (3.0 + f.speed * 8);
      followSpine(f);
      placeKoi(koiMeshes[i], f, time);
    }
  }

  // follow-the-leader: each joint keeps its distance from the one ahead of it,
  // along the line between them, so the body lies on the path the head took
  function followSpine(f) {
    const seg = f.length / (JOINTS - 1), J = f.joints;
    J[0][0] = f.x; J[0][1] = f.z;
    for (let j = 1; j < JOINTS; j++) {
      const dx = J[j][0] - J[j - 1][0], dz = J[j][1] - J[j - 1][1], d = Math.hypot(dx, dz) || 1e-6;
      J[j][0] = J[j - 1][0] + (dx / d) * seg;
      J[j][1] = J[j - 1][1] + (dz / d) * seg;
    }
  }

  // the rest pose laid onto the spine, with the swimming wave and paddling fins
  const spineP = new Float32Array(2), spineT = new Float32Array(2);
  function spineAt(f, sv) {
    const J = f.joints, x = clamp(sv, 0, 1) * (JOINTS - 1);
    const i = Math.min(Math.floor(x), JOINTS - 2), t = x - i;
    spineP[0] = lerp(J[i][0], J[i + 1][0], t); spineP[1] = lerp(J[i][1], J[i + 1][1], t);
    // the direction toward the head, eased between neighbouring segments
    const tan = (k) => { const a = J[Math.max(k, 0)], b = J[Math.min(k + 1, JOINTS - 1)]; const dx = a[0] - b[0], dz = a[1] - b[1], d = Math.hypot(dx, dz) || 1e-6; return [dx / d, dz / d]; };
    const t0 = tan(i - (t < 0.5 ? 1 : 0)), t1 = tan(i + (t < 0.5 ? 0 : 1));
    const w = t < 0.5 ? t + 0.5 : t - 0.5;
    let tx = lerp(t0[0], t1[0], w), tz = lerp(t0[1], t1[1], w);
    const d = Math.hypot(tx, tz) || 1e-6;
    spineT[0] = tx / d; spineT[1] = tz / d;
  }
  function placeKoi(mesh, f, time) {
    const pos = mesh.geometry.attributes.position.array;
    const swim = 0.04 + 0.09 * clamp(f.speed / 1.2, 0, 1);
    const scale = f.length / 0.95;
    for (let v = 0; v < REST.count; v++) {
      const sv = REST.S[v];
      spineAt(f, sv);
      const nx = -spineT[1], nz = spineT[0];                       // to the fish's left
      // the swimming wave: one wavelength along the body, growing toward the tail
      let side = REST.SIDE[v] * scale + swim * (0.12 + 0.88 * sv * sv) * Math.sin(f.phase - sv * 6.3);
      if (REST.FLAP[v] > 0) side += Math.sign(REST.SIDE[v]) * 0.03 * Math.sin(f.phase * 0.6 + 1.0);
      pos[v * 3] = spineP[0] + nx * side;
      pos[v * 3 + 1] = KOI_DEPTH + REST.UP[v] * scale;
      pos[v * 3 + 2] = spineP[1] + nz * side;
    }
    mesh.geometry.attributes.position.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
  }
  // turn heading a toward target by a share of the way, the short way round
  function steer(a, target, amount) {
    let d = target - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return a + d * clamp(amount, 0, 1);
  }

  // ---- the frame ----------------------------------------------------------------
  let substepCarry = 0;
  function update(dt, touches, time) {
    common.uTime.value = time;
    common.uMusic.value.copy(music);
    updateView();
    if (simOK) {
      // the waves run at a fixed 120 steps a second whatever the frame rate
      substepCarry += dt * 120;
      const steps = Math.min(4, Math.floor(substepCarry));
      substepCarry -= steps;
      for (let s = 0; s < steps; s++) {
        let n = 0;
        if (s === 0) for (const q of queued) { if (n < MAX_IMP) impulses[n++].set(...q); }
        // a moving finger pushes the water ahead of it: the wake
        for (const t of touches) {
          if (n >= MAX_IMP) break;
          const sp = Math.min(t.speed, 6);
          if (sp > 0.05) impulses[n++].set(t.x, t.z, 0.3 * (1 + t.depth * 0.5), -0.0005 * sp * (1 + t.depth));
        }
        simMat.uniforms.uCount.value = n;
        simMat.uniforms.uPrev.value = simA.texture;
        passQuad.material = simMat;
        renderer.setRenderTarget(simB);
        renderer.render(passScene, passCam);
        simMat.uniforms.uInit.value = 0;
        [simA, simB] = [simB, simA];
      }
      renderer.setRenderTarget(null);
      simUniforms.uSim.value = simA.texture;
    }
    queued.length = 0;
    stepFloaters(dt, touches, time);
    stepFish(dt, touches, time);
    kicks.length = 0;
  }

  return {
    id: "water", name: "Vatten", group,
    sound: { voice: 2, ring: 6, wet: 0.48 },
    touchHeight: 0.0, glowHeight: 0.06,
    resize() { updateView(); updateArea(); },
    update,
    tune() {},
    enter() { if (simOK) simMat.uniforms.uInit.value = 1; updateView(); },
    exit() {},
    tap(f) {
      impulse(f.world.x, f.world.z, 0.42, -0.22);
      kicks.push({ x: f.world.x, z: f.world.z, amount: 1.6 });
      burst(f.world, [0.75, 0.9, 1.0], 0.5, "splash");
    },
    pluck(f, col, vel) {
      impulse(f.world.x, f.world.z, 0.28, -0.025 * vel);
      kicks.push({ x: f.world.x, z: f.world.z, amount: 0.25 });
    },
    stats() { return { waves: simOK }; },
  };
})();


// ---- scene: sand ------------------------------------------------------------------
// Fine glittering sand, as in a zen garden or an Etch A Sketch: a finger draws a
// groove that stays, with the sand it moved heaped along both sides; a tap
// leaves a pit and kicks up grains; every plucked string sends a ring of
// glitter in its plate's colour. The drawing stays until it is wiped: three
// fingers landing together, or shaking the phone where the browser reports
// motion. The wind's ripples cover everything a groove has not cut through.
//
// A finger that rests digs: the pit deepens and widens into a cone, its rim
// rising around it. A finger pressed in and dragged shovels: the sand it moves
// is carried ahead of it as a heap that grows with the stroke and stays where
// the stroke ends. Sand steeper than it can lie slumps until it can.
//
// Now and then a gust comes through: grains stream low over the sand, the
// ripples creep downwind, the dunes shift a little, and the drawing wears.
//
// The grooves live in a half-float height field that is never faded (or an
// 8-bit one, coarser, where half floats cannot be drawn into). The glitter is
// the trick from Journey's sand (Alan Zucconi's write-up): every grain has its
// own tilt, and a grain flashes when that tilt mirrors the sun into the eye.
const sandScene = (() => {
  const group = new THREE.Group();
  const SIZE = 36, RES = 512;
  const RECT = new THREE.Vector3(-SIZE / 2, -SIZE / 2, SIZE);
  const MAX_STROKE = 12, MAX_HEAP = 8;
  const TEXEL = SIZE / RES;
  const MAX_DIG = 1.25, MAX_HEAP_RADIUS = 2.0;   // a heap that wide stands about 0.85 m
  const REPOSE = 0.67;                       // tan of the angle dry sand lies at, about 34 degrees
  const WIND = new THREE.Vector2(0.62, 0.78); // downwind, in x and z; the ripples' crests lie across it
  const TONEMAP = "vec3 tonemap(vec3 x) { x *= 0.62; return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }";

  // ---- the drawing: height of the sand where fingers have been ----
  function fieldTarget() {
    return new THREE.WebGLRenderTarget(RES, RES, {
      type: floatTargets ? THREE.HalfFloatType : THREE.UnsignedByteType, format: THREE.RGBAFormat,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false,
    });
  }
  let fieldA = fieldTarget(), fieldB = fieldTarget();
  // 8-bit targets store height * 0.3 + 0.5, so pits 1.5 m deep and heaps as tall both fit
  const ENC = floatTargets ? "h" : "(h * 0.3 + 0.5)";
  const DEC = floatTargets ? "v" : "((v - 0.5) / 0.3)";
  const strokes = Array.from({ length: MAX_STROKE }, () => new THREE.Vector4());   // from x, z, to x, z
  const shapes = Array.from({ length: MAX_STROKE }, () => new THREE.Vector4());    // groove radius, groove depth, rim height, pit depth
  const heaps = Array.from({ length: MAX_HEAP }, () => new THREE.Vector4());       // x, z, radius, height
  const drawMat = new THREE.ShaderMaterial({
    vertexShader: PASS_VERT,
    uniforms: {
      uPrev: { value: null }, uInit: { value: 1 }, uErase: { value: 0 }, uRepose: { value: REPOSE },
      uCount: { value: 0 }, uStroke: { value: strokes }, uShape: { value: shapes }, uRect: { value: RECT },
      uHeapCount: { value: 0 }, uHeap: { value: heaps },
    },
    fragmentShader: `
      uniform sampler2D uPrev; uniform float uInit, uErase, uRepose; uniform int uCount, uHeapCount;
      uniform vec4 uStroke[${MAX_STROKE}]; uniform vec4 uShape[${MAX_STROKE}]; uniform vec4 uHeap[${MAX_HEAP}]; uniform vec3 uRect;
      varying vec2 vUv;
      float decode(float v) { return ${DEC}; }
      float encode(float h) { return ${ENC}; }
      void main() {
        float h = decode(texture2D(uPrev, vUv).r) * (1.0 - uInit);
        h *= 1.0 - uErase;                                       // a shake smooths it all away, a gust a little
        vec2 w = uRect.xy + vUv * uRect.z;
        for (int i = 0; i < ${MAX_STROKE}; i++) {
          if (i >= uCount) break;
          vec2 a = uStroke[i].xy, b = uStroke[i].zw;
          vec2 ab = b - a;
          float t = clamp(dot(w - a, ab) / max(dot(ab, ab), 1e-8), 0.0, 1.0);
          float dist = length(w - (a + ab * t));
          vec4 s = uShape[i];
          // the groove under the finger, and the pit it digs where it rests:
          // a cone no steeper than the sand will stand
          float outer = s.x + s.w / (uRepose * 0.9);
          float dg = dist / s.x;
          float trough = -s.y * max(1.0 - dg * dg, 0.0) - s.w * max(1.0 - dist / outer, 0.0);
          if (dist < outer) h = min(h, trough);
          // the sand it pushed aside, heaped along both edges and around the pit
          float d = dist / outer;
          float rim = s.z * sin(3.14159 * clamp((d - 0.85) / 0.9, 0.0, 1.0));
          // only on sand nobody has drawn in yet: a new stretch of groove must not
          // wall off the groove it continues, or a line becomes a row of beads
          if (d > 0.85 && d < 1.75 && h > -0.002) h = max(h, rim);
        }
        // the heaps shovelled ahead of the fingers, lying over whatever is
        // there: a heap pushed across a pit or a groove sits in it, it does not
        // fill it, so a pit a finger climbs out of keeps its shape
        for (int i = 0; i < ${MAX_HEAP}; i++) {
          if (i >= uHeapCount) break;
          float d = length(w - uHeap[i].xy) / uHeap[i].z;
          float k = max(1.0 - d * d, 0.0);
          if (k > 0.0) h = max(h, min(h, 0.0) + uHeap[i].w * k * k);
        }
        gl_FragColor = vec4(encode(h), 0.0, 0.0, 1.0);
      }`,
  });
  // Slumping: wherever the sand between two neighbouring cells is steeper than it
  // can lie, the excess runs downhill. Every exchange is counted from both
  // sides, so no sand is made or lost.
  const slumpMat = new THREE.ShaderMaterial({
    vertexShader: PASS_VERT,
    uniforms: { uPrev: { value: null }, uTexel: { value: 1 / RES }, uMaxDiff: { value: REPOSE * TEXEL } },
    fragmentShader: `
      uniform sampler2D uPrev; uniform float uTexel, uMaxDiff;
      varying vec2 vUv;
      float decode(float v) { return ${DEC}; }
      float encode(float h) { return ${ENC}; }
      float at(vec2 o) { return decode(texture2D(uPrev, vUv + o * uTexel).r); }
      float flow(float h, float n, float limit) { float d = n - h; return sign(d) * max(abs(d) - limit, 0.0); }
      void main() {
        float h = at(vec2(0.0));
        float m = uMaxDiff, md = uMaxDiff * 1.4142;
        float f = flow(h, at(vec2(1.0, 0.0)), m) + flow(h, at(vec2(-1.0, 0.0)), m)
                + flow(h, at(vec2(0.0, 1.0)), m) + flow(h, at(vec2(0.0, -1.0)), m)
                + flow(h, at(vec2(1.0, 1.0)), md) + flow(h, at(vec2(-1.0, 1.0)), md)
                + flow(h, at(vec2(1.0, -1.0)), md) + flow(h, at(vec2(-1.0, -1.0)), md);
        gl_FragColor = vec4(encode(h + f * 0.1), 0.0, 0.0, 1.0);
      }`,
  });
  const queued = [], queuedHeaps = [];
  function addStroke(ax, az, bx, bz, radius, depth, rim, pit) {
    if (queued.length < MAX_STROKE) queued.push([ax, az, bx, bz, radius, depth, rim, pit]);
  }
  function addHeap(x, z, radius, height) {
    if (queuedHeaps.length < MAX_HEAP) queuedHeaps.push([x, z, radius, height]);
  }

  const fieldUniforms = { uField: { value: fieldA.texture }, uFieldRect: { value: RECT } };
  const common = Object.assign({
    uNoise: { value: noiseTex }, uTime: { value: 0 }, uMusic: { value: new THREE.Vector3() },
    uRipple: { value: rippleRT.texture }, uRippleRect: { value: new THREE.Vector3(-BEND_SIZE / 2, -BEND_SIZE / 2, BEND_SIZE) },
    uWind: { value: new THREE.Vector4(WIND.x, WIND.y, 0, 0) },
    uDrift: { value: new THREE.Vector2() },     // how far the blown sand has streamed, and how hard it blows
  }, lightUniforms, fieldUniforms);

  const FIELD_GLSL = `
    uniform sampler2D uField; uniform vec3 uFieldRect;
    uniform sampler2D uNoise;
    uniform vec4 uWind;          // downwind x, z; how far the ripples have crept; how far the dunes have moved
    float fieldAt(vec2 xz) {
      vec2 uv = (xz - uFieldRect.xy) / uFieldRect.z;
      float inside = step(0.0, uv.x) * step(uv.x, 1.0) * step(0.0, uv.y) * step(uv.y, 1.0);
      float v = texture2D(uField, uv).r;
      return ${DEC} * inside;
    }
    // the dunes: long gentle windward slopes and short steep lee faces, low in
    // the middle where fingers draw and taller further out
    float duneAt(vec2 xz) {
      vec2 p = xz - uWind.xy * uWind.w;
      float s = dot(p, uWind.xy) / 7.5 + texture2D(uNoise, p / 53.0).r * 2.2;
      float u = fract(s);
      float prof = u < 0.75 ? smoothstep(0.0, 1.0, u / 0.75) : smoothstep(0.0, 1.0, (1.0 - u) / 0.25);
      float vary = 0.5 + texture2D(uNoise, p / 37.0 + 0.3).g;
      return (prof - 0.5) * (0.14 + 0.32 * smoothstep(4.0, 14.0, length(xz))) * vary;
    }
  `;

  const sandMat = new THREE.ShaderMaterial({
    uniforms: common,
    extensions: { derivatives: true },
    vertexShader: `
      varying vec3 vWorld;
      ${FIELD_GLSL}
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        // the dunes flatten toward the edge of the near sand, which the far sand meets flat
        float edge = 1.0 - smoothstep(15.0, 17.8, max(abs(w.x), abs(w.z)));

      uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity;
      varying vec3 vWorld;
      ${FIELD_GLSL}
      ${TONEMAP}
      float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

      void main() {
        vec2 xz = vWorld.xz;
        float e = 0.05;

        float hx = fieldAt(xz + vec2(e, 0.0)) - fieldAt(xz - vec2(e, 0.0));
        float hz = fieldAt(xz + vec2(0.0, e)) - fieldAt(xz - vec2(0.0, e));
        float ed = 0.15;
        float dx = duneAt(xz + vec2(ed, 0.0)) - duneAt(xz - vec2(ed, 0.0));
        float dz = duneAt(xz + vec2(0.0, ed)) - duneAt(xz - vec2(0.0, ed));

        vec2 inCell = fract(xz * 17.0) - 0.5;

  const sand = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE, 320, 320), sandMat);
  sand.rotation.x = -Math.PI / 2;
  group.add(sand);
  const far = new THREE.Mesh(new THREE.RingGeometry(SIZE * 0.5 * Math.SQRT2, 160, 4, 1, Math.PI / 4), sandMat);
  far.rotation.x = -Math.PI / 2;
  far.position.y = -0.003;
  group.add(far);

  const GRAINS = 700, GRAIN_REACH = 9;

  const gPos = new Float32Array(GRAINS * 3);
  const gSpeed = new Float32Array(GRAINS), gHop = new Float32Array(GRAINS), gPhase = new Float32Array(GRAINS);
  for (let i = 0; i < GRAINS; i++) {
    gPos[i * 3] = (Math.random() - 0.5) * 2 * GRAIN_REACH;
    gPos[i * 3 + 2] = (Math.random() - 0.5) * 2 * GRAIN_REACH;
    gSpeed[i] = 0.6 + 0.8 * Math.random();
    gHop[i] = 0.02 + 0.2 * Math.pow(Math.random(), 2);
    gPhase[i] = Math.random() * Math.PI * 2;

  grainGeo.setAttribute("position", new THREE.BufferAttribute(gPos, 3));
  const grainMat = new THREE.PointsMaterial({
    size: 0.08, map: dotTex, color: new THREE.Color(0.95, 0.8, 0.58), transparent: true, depthWrite: false, sizeAttenuation: true, opacity: 0.6,

  const grains = new THREE.Points(grainGeo, grainMat);

  let gustClock = 0, gustAt = 12 + Math.random() * 15, gust = 0;
  const GUST_SECONDS = 10;

    gustClock += dt;
    const u = (gustClock - gustAt) / GUST_SECONDS;
    gust = u > 0 && u < 1 ? Math.pow(Math.sin(Math.PI * u), 2) : 0;
    if (u >= 1) { gustClock = 0; gustAt = 40 + Math.random() * 40; }
    const w = common.uWind.value;
    w.z += dt * (0.02 + 0.55 * gust);       // the ripples creep a third of a crest per gust
    w.w += dt * 0.08 * gust;                // the dunes move under half a metre
    common.uDrift.value.set(common.uDrift.value.x + dt * (0.5 + 2.6 * gust), gust);

  }

  function moveGrains(dt, strength) {

    const speed = 0.5 + 2.6 * strength;

      let z = gPos[i * 3 + 2] + WIND.y * speed * gSpeed[i] * dt;
      // along and across the wind, from the middle of the view
      let a = (x - cx) * WIND.x + (z - cz) * WIND.y;
      let b = -(x - cx) * WIND.y + (z - cz) * WIND.x;
      if (a > R || a < -R || b > R || b < -R) {
        a = a > R ? a - 2 * R : a < -R ? a + 2 * R : a;
        if (b > R || b < -R) b = (Math.random() - 0.5) * 2 * R;

        z = cz + a * WIND.y + b * WIND.x;

      gPhase[i] += dt * (3 + 4 * gSpeed[i]) * (0.5 + strength);
      gPos[i * 3] = x; gPos[i * 3 + 2] = z;

    }

    grainGeo.setDrawRange(0, Math.floor(GRAINS * (0.08 + 0.92 * strength)));

    grainMat.color.setRGB(1.15 * (am.r * 0.6 + s.r * 0.75), 1.0 * (am.g * 0.6 + s.g * 0.75), 0.78 * (am.b * 0.6 + s.b * 0.75));

    common.uTime.value = time;
    common.uMusic.value.copy(music);

    const wind = blow(dt);

    grainTime += dt;

      } else {

        // pushes the sand it cuts ahead of it; a dragged hand gathers more than

    }
    if (spray) grainTime = 0;

    let eraseNow = 0;
    if (erasing > 0) { eraseNow = 1 - Math.exp(-dt / 0.22); erasing -= dt; }
    // a gust wears the drawing by about 5%, in a dozen small steps: a half-float
    // target rounds toward zero, so wearing a little every frame would lose a
    // whole step of precision each time and flatten everything
    wear += 0.01 * wind * dt;

    for (const q of queued) {

      shapes[n].set(q[4], q[5], q[6], q[7]);

      drawMat.uniforms.uHeapCount.value = m;
      drawMat.uniforms.uErase.value = eraseNow;

      drawMat.uniforms.uInit.value = 0;

  return {
    id: "sand", name: "Sand", group,
    sound: { voice: 5, ring: 5, wet: 0.42 },
    touchHeight: 0.0, glowHeight: 0.04,
    resize() {},
    update,
    tune() {},
    enter() {},
    exit() {},
    tap(f) {
      addStroke(f.world.x, f.world.z, f.world.x, f.world.z, 0.2, 0.06, 0.03, 0);
      burst(f.world, SAND, 0.5, "sand", 18);
    },
    pluck() {},
    // wiped like an Etch A Sketch: the sand settles flat over about a second,
    // grains spraying up across the view
    erase() {
      erasing = 1.1;
      for (let k = 0; k < 10; k++) {
        const p = { x: camera.position.x + (Math.random() - 0.5) * 8, y: 0, z: camera.position.z - 2 + (Math.random() - 0.5) * 8 };
        burst(p, SAND, 0.8, "sand", 10);
      }
    },
    // for testing: the wind's state, and a gust on demand
    stats() { return { drawing: floatTargets ? "half" : "8-bit", gust: +gust.toFixed(2) }; },
    gustNow() { gustAt = gustClock; },
    field() { return fieldA; },
  };
})();


// ---- scene: clouds ----------------------------------------------------------------
// Above a sea of cumulus, with the land far below. Where a finger lands decides
// what it does: on open sky it draws new cloud along its path; on a cloud it
// pulls the cloud along with it, and the cloud thins out as it is stretched; a
// poke into a cloud opens a hole, and a finger left resting there keeps
// widening it, the cloud pushed aside into a ring. The clouds drift on the wind,
// their tops slowly boiling, and the plucked strings' rings glow in them.
//
// How it is drawn: a density field (half float, wrapping, so the clouds that
// drift off one side come back on the other) holds what fingers have made. A
// second pass turns density into a cloud shape (height, with noise for the
// cauliflower tops) and lights it: sun on the slopes, self-shadow toward the
// sun, darker hollows. Each pixel then marches its view ray down through the
// shape: a thick cloud turns opaque within a metre, a stretched one is shallow
// and stays sheer. (Stacked slices were tried first; seen at a slant they
// stepped like terraces.) The field is never advected by the wind; it is drawn
// at an offset instead, so drifting costs nothing and blurs nothing.
const cloudScene = (() => {
  const group = new THREE.Group();
  const SIZE = 48, RES = 256, SHAPE_RES = 512;
  const TOP = 3.6, MARCH_STEPS = 16;        // the cloud layer's depth, and the steps a ray takes through it
  const GROUND = -30;                        // the land, far below
  const MAX_EDIT = 10;

  function wrapTarget(res, float) {
    return new THREE.WebGLRenderTarget(res, res, {
      type: float && floatTargets ? THREE.HalfFloatType : THREE.UnsignedByteType, format: THREE.RGBAFormat,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false,
      wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping,
    });

  let fieldA = wrapTarget(RES, true), fieldB = wrapTarget(RES, true);
  const shapeRT = wrapTarget(SHAPE_RES, false);
  // 8-bit fields store density / 1.5
  const DEC = floatTargets ? "v" : "(v * 1.5)";
  const ENC = floatTargets ? "d" : "(d / 1.5)";

  // ---- the field: what fingers have made ----
  const segs = Array.from({ length: MAX_EDIT }, () => new THREE.Vector4());     // from x, z, to x, z (field metres)
  const shapes = Array.from({ length: MAX_EDIT }, () => new THREE.Vector4());   // radius, kind (0 draw, 1 stretch, 2 hole), amount, push
  const fieldMat = new THREE.ShaderMaterial({
    vertexShader: PASS_VERT,
    uniforms: {
      uPrev: { value: null }, uNoise: { value: noiseTex }, uInit: { value: 1 }, uClear: { value: 0 }, uSize: { value: SIZE },
      uCount: { value: 0 }, uSeg: { value: segs }, uShape: { value: shapes },
    },
    fragmentShader: `
      uniform sampler2D uPrev, uNoise; uniform float uInit, uClear, uSize; uniform int uCount;
      uniform vec4 uSeg[${MAX_EDIT}]; uniform vec4 uShape[${MAX_EDIT}];
      varying vec2 vUv;
      float dens(vec2 uv) { float v = texture2D(uPrev, uv).r; return ${DEC}; }
      vec2 wrapped(vec2 d) { return d - uSize * floor(d / uSize + 0.5); }
      void main() {
        vec2 w = vUv * uSize;

        // it goes; a hole: the cloud pushed outward from the finger, thinned in
        // the middle, so it piles into a rim around the opening
        vec2 disp = vec2(0.0); float thin = 1.0;
        for (int i = 0; i < ${MAX_EDIT}; i++) {
          if (i >= uCount) break;
          vec4 s = uShape[i];
          vec2 d = wrapped(w - uSeg[i].zw);
          if (abs(s.y - 1.0) < 0.5) {
            vec2 v = wrapped(uSeg[i].zw - uSeg[i].xy);
            float k = exp(-dot(d, d) / (s.x * s.x));
            disp += v * k; thin *= 1.0 - s.z * k;
          } else if (s.y > 1.5) {
            float q = length(d) / s.x;
            disp += d / max(length(d), 1e-4) * s.w * s.x * q * exp(-q * q) * 2.33;
            thin *= 1.0 - s.z * (1.0 - smoothstep(0.3, 0.8, q));
          }
        }
        float d = dens(vUv - disp / uSize) * thin;
        if (uInit > 0.5) {
          // the first sky: big soft heaps of cumulus over about a third of it
          float a = texture2D(uNoise, vUv).a, b = texture2D(uNoise, vUv * 2.0).b;
          d = smoothstep(0.46, 0.6, a + 0.3 * (b - 0.5));
        }
        d *= 1.0 - uClear;
        for (int i = 0; i < ${MAX_EDIT}; i++) {
          if (i >= uCount) break;
          vec4 s = uShape[i];
          if (s.y < 0.5) {
            // drawing on open sky: cloud laid along the stroke
            vec2 pa = wrapped(w - uSeg[i].xy), ab = wrapped(uSeg[i].zw - uSeg[i].xy);
            float t = clamp(dot(pa, ab) / max(dot(ab, ab), 1e-6), 0.0, 1.0);
            float q = length(pa - ab * t) / s.x;
            d = max(d, min(d + s.z * exp(-q * q * 2.0), 1.3));
          }

      }`,
  });

  // ---- the shape: height of the cloud tops, and how they are lit ----
  const shapeMat = new THREE.ShaderMaterial({
    vertexShader: PASS_VERT,
    uniforms: Object.assign({ uField: { value: fieldA.texture }, uNoise: { value: noiseTex }, uTime: { value: 0 }, uSize: { value: SIZE } }, lightUniforms),
    fragmentShader: `
      uniform sampler2D uField, uNoise; uniform float uTime, uSize;
      uniform vec3 uSunDir;
      varying vec2 vUv;
      float heightAt(vec2 uv) {
        float v = texture2D(uField, uv).r;
        float d = ${DEC};
        // the tops boil slowly: noise drifting two ways (whole-number scales, so it wraps with the field)
        vec2 drift = vec2(uTime * 0.0021, uTime * 0.0013);
        float n = texture2D(uNoise, uv * 3.0 + drift).b * 0.55 + texture2D(uNoise, uv * 7.0 - drift * 1.7).b * 0.33
                + texture2D(uNoise, uv * 19.0 + drift * 2.3).b * 0.12;
        // rounded heaps, not peaks: height rises fast at a cloud's edge and
        // flattens over its middle, as a cumulus does
        float x = max(0.0, d * (0.45 + 1.1 * n) - 0.1);
        return 3.2 * pow(x, 0.7);
      }
      void main() {
        float e = 1.5 / ${SHAPE_RES}.0;
        float h = heightAt(vUv);
        float hx = heightAt(vUv + vec2(e, 0.0)) - heightAt(vUv - vec2(e, 0.0));
        float hz = heightAt(vUv + vec2(0.0, e)) - heightAt(vUv - vec2(0.0, e));
        vec3 n = normalize(vec3(-hx / (2.0 * e * uSize), 1.0, -hz / (2.0 * e * uSize)));
        float lam = dot(n, uSunDir) * 0.5 + 0.5;                 // wrapped: clouds scatter light round their sides
        // self-shadow: is there taller cloud between here and the sun?
        vec2 toward = uSunDir.xz / max(length(uSunDir.xz), 1e-3);
        float rise = uSunDir.y / max(length(uSunDir.xz), 0.05);
        float shade = 0.0;
        for (int k = 1; k <= 3; k++) {
          float dist = float(k) * 0.6;
          float above = heightAt(vUv + toward * dist / uSize) - (h + dist * rise);
          shade = max(shade, smoothstep(0.0, 0.6, above));
        }
        // hollows: lower than the cloud around them
        float around = (heightAt(vUv + vec2(4.0 * e, 0.0)) + heightAt(vUv - vec2(4.0 * e, 0.0))
                      + heightAt(vUv + vec2(0.0, 4.0 * e)) + heightAt(vUv - vec2(0.0, 4.0 * e))) * 0.25;
        float hollow = clamp(1.0 - (around - h) * 1.2, 0.0, 1.0);

  // One sheet over the top of the cloud layer; each pixel follows its view ray
  // down through the layer in a fixed number of steps (offset a little per
  // pixel, so the steps blur into a volume), gathering light where the ray is
  // inside a cloud, until the cloud is opaque or the ray reaches the base.
  const offset = new THREE.Vector2();
  const marchUniforms = Object.assign({
    uShapeTex: { value: shapeRT.texture }, uOffset: { value: offset }, uSize: { value: SIZE },
    uRipple: { value: rippleRT.texture }, uRippleRect: { value: new THREE.Vector3(-BEND_SIZE / 2, -BEND_SIZE / 2, BEND_SIZE) },
    uMusic: { value: new THREE.Vector3() },
  }, lightUniforms);
  const marchMat = new THREE.ShaderMaterial({
    uniforms: marchUniforms,
    transparent: true, depthWrite: false,
    vertexShader: `
      varying vec3 vWorld;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `
      uniform sampler2D uShapeTex, uRipple; uniform vec2 uOffset; uniform float uSize;
      uniform vec3 uRippleRect, uMusic;
      uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity;
      varying vec3 vWorld;
      ${TONEMAP}
      void main() {

        float rise = uSunDir.y / max(length(uSunDir.xz), 0.05);
        if (rd.y > -0.02) discard;
        float t0 = max((${TOP.toFixed(2)} - cameraPosition.y) / rd.y, 0.0);
        float t1 = -cameraPosition.y / rd.y;
        float dt = (t1 - t0) / ${MARCH_STEPS}.0;
        float jitter = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
        vec3 col = vec3(0.0);
        float trans = 1.0, hitT = t1;
        for (int i = 0; i < ${MARCH_STEPS}; i++) {
          float t = t0 + (float(i) + jitter) * dt;
          vec3 p = cameraPosition + rd * t;
          vec4 s = texture2D(uShapeTex, (p.xz - uOffset) / uSize);
          float h = s.r * 3.0;
          float inside = h - p.y;
          if (inside > 0.0) {
            // a thick cloud fills up within a metre; a thin one stays sheer
            float a = 1.0 - exp(-2.4 * dt * smoothstep(0.0, 0.5, inside) * min(1.0, h / 0.6 + 0.25));
            float top = clamp(p.y / max(h, 0.01), 0.0, 1.0);
            // one step toward the sun: how much cloud stands between this point
            // and the light. Sunlit tops go white, the far sides and the bases
            // fall into the sky's blue
            float hs = texture2D(uShapeTex, (p.xz + toward * 0.7 - uOffset) / uSize).r * 3.0;
            float sunVis = exp(-2.2 * max(0.0, hs - (p.y + 0.7 * rise))) * mix(0.55, 1.0, s.g);
            vec3 lit = uSunCol * (0.05 + 1.35 * sunVis) + uAmbient * (0.4 + 0.45 * top);

            if (trans > 0.99) hitT = t;

        float alpha = 1.0 - trans;
        col /= alpha;
        vec3 hit = cameraPosition + rd * hitT;

        col += ring * (0.5 + 0.4 * uMusic.z);

  });
  const sheet = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), marchMat);
  sheet.rotation.x = -Math.PI / 2;

  sheet.renderOrder = 10;
  group.add(sheet);

  // ---- the land far below, seen through the holes, under the clouds' shadows ----
  const groundMat = new THREE.ShaderMaterial({
    uniforms: Object.assign({ uNoise: { value: noiseTex }, uShapeTex: { value: shapeRT.texture }, uOffset: { value: offset }, uSize: { value: SIZE } }, lightUniforms),
    vertexShader: `
      varying vec3 vWorld;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `
      uniform sampler2D uNoise, uShapeTex; uniform vec2 uOffset; uniform float uSize;
      uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity;
      varying vec3 vWorld;
      ${TONEMAP}
      void main() {
        vec2 xz = vWorld.xz;
        float land = texture2D(uNoise, xz / 260.0).g + (texture2D(uNoise, xz / 70.0).b - 0.5) * 0.25;
        float shore = smoothstep(0.47, 0.5, land);
        vec3 sea = mix(vec3(0.06, 0.18, 0.30), vec3(0.08, 0.24, 0.34), texture2D(uNoise, xz / 90.0).r * 0.5);
        float fields = texture2D(uNoise, xz / 22.0).b;
        vec3 earth = mix(vec3(0.20, 0.32, 0.12), vec3(0.42, 0.40, 0.20), fields);
        earth = mix(earth, vec3(0.14, 0.24, 0.10), smoothstep(0.55, 0.65, texture2D(uNoise, xz / 40.0).g));
        vec3 col = mix(sea, earth, shore);
        col = mix(col, vec3(0.62, 0.6, 0.5), 0.5 * smoothstep(0.47, 0.475, land) * (1.0 - smoothstep(0.477, 0.485, land)));
        // the clouds' shadows: follow the sun up to the cloud layer
        vec2 up = xz + uSunDir.xz / max(uSunDir.y, 0.15) * (${-GROUND}.0 + 1.0);
        float cloud = texture2D(uShapeTex, (up - uOffset) / uSize).r * 3.0;
        float lightHere = 1.0 - 0.6 * smoothstep(0.1, 0.8, cloud);
        vec3 lit = col * (uAmbient * 0.7 + uSunCol * max(uSunDir.y, 0.0) * 0.9 * lightHere);
        float fog = 1.0 - exp(-uFogDensity * 2.4 * length(vWorld - cameraPosition));
        gl_FragColor = vec4(pow(tonemap(mix(lit, uFogCol, fog)), vec3(1.0 / 2.2)), 1.0);
      }`,
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = GROUND;
  ground.renderOrder = 0;
  group.add(ground);

  // ---- looking under a finger: is it on a cloud? ----
  const probe = new Uint8Array(4);
  function cloudAt(x, z) {
    let u = ((x - offset.x) / SIZE) % 1, v = ((z - offset.y) / SIZE) % 1;
    if (u < 0) u += 1;
    if (v < 0) v += 1;
    try {
      renderer.readRenderTargetPixels(shapeRT, Math.min(SHAPE_RES - 1, Math.floor(u * SHAPE_RES)), Math.min(SHAPE_RES - 1, Math.floor(v * SHAPE_RES)), 1, 1, probe);
      return probe[0] / 255 * 3;
    } catch (e) { return 0; }
  }

  // ---- the frame ----------------------------------------------------------------
  const edits = [];
  function edit(ax, az, bx, bz, radius, kind, amount, push = 0) {
    if (edits.length < MAX_EDIT) edits.push([ax - offset.x, az - offset.y, bx - offset.x, bz - offset.y, radius, kind, amount, push]);
  }
  let clearing = 0, mistTime = 0;
  const MIST = [1, 1, 1];
  function update(dt, touches, time) {
    offset.x = (offset.x + WIND.x * DRIFT * dt) % SIZE;
    offset.y = (offset.y + WIND.y * DRIFT * dt) % SIZE;
    marchUniforms.uMusic.value.copy(music);
    const viewScale = clamp(camera.position.y / 11, 0.6, 1.6);
    const frames = dt * 60;
    mistTime += dt;
    const mist = mistTime > 0.08;
    for (const t of touches) {
      const f = t.finger;
      const moved = Math.hypot(t.x - t.px, t.z - t.pz);
      if (!f.cloudMode) f.cloudMode = "sky";
      if (f.cloudMode === "sky") {
        edit(t.px, t.pz, t.x, t.z, 0.75 * viewScale * (1 + 0.5 * t.depth), 0, (0.07 + 0.05 * t.depth) * frames);
        if (mist && moved > 0.01) burst({ x: t.x, y: 1.2, z: t.z }, MIST, 0.15, "pollen", 2);
      } else if (moved > 0.004) {
        // pulling the cloud along; the faster the pull, the thinner it goes
        const R = 1.2 * viewScale * (1 + 0.4 * t.depth);
        edit(t.px, t.pz, t.x, t.z, R, 1, Math.min(moved / R, 1) * 0.3);
        f.holeTime = 0;

    let clearNow = 0;
    if (clearing > 0) { clearNow = 1 - Math.exp(-dt / 0.35); clearing -= dt; }
    if (edits.length || clearNow > 0 || fieldMat.uniforms.uInit.value > 0) {
      for (let i = 0; i < edits.length; i++) {
        const q = edits[i];

        shapes[i].set(q[4], q[5], q[6], q[7]);

      fieldMat.uniforms.uClear.value = clearNow;
      fieldMat.uniforms.uPrev.value = fieldA.texture;

      fieldMat.uniforms.uInit.value = 0;

    id: "clouds", name: "Moln", group,
    sound: { voice: 6, ring: 6, wet: 0.5 },
    touchHeight: 1.2, glowHeight: 1.6,
    resize() {},
    update,
    tune() {},
    enter() {},
    exit() {},
    // where a finger lands decides what it does: open sky draws, a cloud is
    // pulled or, poked, opened
    tap(f) {

      f.cloudMode = onCloud ? "cloud" : "sky";

    // wiped: the wind clears the sky
    erase() { clearing = 1.4; },
    stats() { return { field: floatTargets ? "half" : "8-bit" }; },
    field() { return fieldA; },
    shape() { return shapeRT; },
  };
})();


const SCENES = [meadowScene, waterScene, sandScene, cloudScene];
let activeScene = meadowScene;

// Switch scene: its surface replaces the last one, fingers meet it at its
// height, and its sound (strings, ring time, room) comes in. A sound the player
// changed in a scene is remembered for that scene.
function setScene(id) {
  const next = SCENES.find((sc) => sc.id === id) || meadowScene;
  if (activeScene !== next) { scene.remove(activeScene.group); activeScene.exit(); }
  activeScene = next;
  if (!next.group.parent) scene.add(next.group);
  next.enter();
  next.resize();
  plane.constant = -next.touchHeight;
  settings.scene = next.id;
  const snd = settings.sound[next.id] || next.sound;
  settings.voice = snd.voice;
  settings.ring = snd.ring;
  if (wetGain) wetGain.gain.setTargetAtTime(next.sound.wet, ctx.currentTime, 0.4);
  if (ctx) sendStrings();
  syncSoundControls();
  document.querySelectorAll(".scene-pick").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.scene === next.id)));
  const chip = document.getElementById("scene-next");
  if (chip) chip.innerHTML = "<span class=\"pre\">Scen: </span>" + next.name;
  saveSettings();
}
function syncSoundControls() {
  const v = document.getElementById("voice"), r = document.getElementById("ring");
  if (v && v.options.length) v.value = String(settings.voice);
  if (r) r.value = settings.ring;
}
function rememberSound() { settings.sound[activeScene.id] = { voice: settings.voice, ring: settings.ring }; }

// ---- sound ---------------------------------------------------------------------
let ctx = null, node = null, mainEngine = null, analyser = null, freqData = null, wetGain = null;
const music = new THREE.Vector3();

function post(c) {
  if (node && node.port) node.port.postMessage(c);
  else if (mainEngine) mainEngine.command(c);
}

function impulse(ctx, seconds) {
  const len = Math.floor(ctx.sampleRate * seconds), pre = Math.floor(ctx.sampleRate * 0.04);
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    let lp = 0;
    for (let i = pre; i < len; i++) {
      const t = (i - pre) / ctx.sampleRate;
      lp += (0.35 + 0.5 * Math.exp(-t * 2)) * ((Math.random() * 2 - 1) - lp);
      d[i] = lp * Math.exp(-t * 2.4);
    }
  }
  return ir;
}

async function startAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { showError("Webbläsaren har inget Web Audio, så det blir tyst."); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  ctx = new AC({ latencyHint: "interactive" });
  const mobile = /Android|iPhone|iPad/.test(navigator.userAgent);
  const voices = mobile ? 32 : 48;
  let source = null;
  if (ctx.audioWorklet) {
    try {
      const code = "const TouchGrassEngine = " + TouchGrassEngine.toString() + ";\n(" +
        TouchGrassProcessor.toString() + ")(TouchGrassEngine());";
      const url = URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
      await ctx.audioWorklet.addModule(url);
      node = new AudioWorkletNode(ctx, "grass-engine", { numberOfInputs: 0, outputChannelCount: [2], processorOptions: { voices } });
      source = node;
    } catch (e) { node = null; }
  }
  if (!source) {
    // the browser refused the worklet: run the engine on the main thread
    mainEngine = new E.GrassEngine(ctx.sampleRate, voices);
    const sp = ctx.createScriptProcessor(1024, 0, 2);
    sp.onaudioprocess = (ev) => {
      const L = ev.outputBuffer.getChannelData(0), R = ev.outputBuffer.getChannelData(1);
      mainEngine.render(L, R, L.length);
    };
    source = sp;
  }
  const master = ctx.createGain(); master.gain.value = 1.0;
  const dry = ctx.createGain(); dry.gain.value = 0.9;
  const wet = ctx.createGain(); wet.gain.value = activeScene.sound.wet;
  wetGain = wet;
  const reverb = ctx.createConvolver(); reverb.buffer = impulse(ctx, 3.2);
  source.connect(dry).connect(master);
  source.connect(reverb).connect(wet).connect(master);
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.6;
  freqData = new Float32Array(analyser.frequencyBinCount);
  master.connect(analyser).connect(ctx.destination);
  if (ctx.state !== "running") await ctx.resume();
  sendDrone();
  sendStrings();
  post({ t: "tone", v: 1 });     // the shared filter stays open: colour is per note now
  startDroneOn(middlePlate());
}

function listenToMusic(dt) {
  if (!analyser) return;
  analyser.getFloatFrequencyData(freqData);
  const binHz = ctx.sampleRate / analyser.fftSize;
  const bands = [[40, 250], [250, 2000], [2000, 9000]];
  for (let k = 0; k < 3; k++) {
    const a = Math.max(1, Math.floor(bands[k][0] / binHz)), b = Math.min(freqData.length - 1, Math.ceil(bands[k][1] / binHz));
    let p = 0;
    for (let i = a; i <= b; i++) p += Math.pow(10, freqData[i] / 10);
    const db = 10 * Math.log10(p + 1e-12);
    const now = clamp((db + 70) / 45, 0, 1);
    const key = k === 0 ? "x" : k === 1 ? "y" : "z";
    const rate = now > music[key] ? 0.08 : 0.6;
    music[key] = lerp(music[key], now, 1 - Math.exp(-dt / rate));
  }
}

// ---- fingers on the plates ----------------------------------------------------
// Each finger has its own strum state, as each hand did in the Godot app.
const fingers = new Map();
let dronePlate = -1;
const middlePlate = () => Math.floor((CHORDS.length - 1) / 2);
function startDroneOn(k) {
  dronePlate = k;
  post({ t: "chord", root: CHORDS[k][0], quality: CHORDS[k][1] });
}
function sendStrings() {
  post({ t: "voice", v: settings.voice });
  post({ t: "ring", v: settings.ring });
}
function sendDrone() {
  post({ t: "drone", v: settings.drone ? settings.droneLevel : 0 });
  post({ t: "droneBright", v: settings.droneBright });
}
const ripples = [];

function newFinger(id) {
  const sprite = new THREE.Sprite(glowMat.clone());
  sprite.scale.set(1.1, 1.1, 1);
  scene.add(sprite);
  return { id, plate: -1, prev: -1, armed: new Uint8Array(16).fill(1), speed: 0, depth: 0,
           world: new THREE.Vector3(), vel: new THREE.Vector2(), last: 0, sprite, sx: 0, sy: 0, down: true, lastPluck: -10 };
}

const ray = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -GRASS_TOP * 0.8);   // setScene moves it to the scene's surface
function worldAt(sx, sy, out) {
  ray.setFromCamera(new THREE.Vector2(sx * 2 - 1, 1 - sy * 2), camera);
  return ray.ray.intersectPlane(plane, out);
}

// tap: this is the finger landing. As in the Omnichord app, touching down on
// the plate strikes the string under the finger; sweeping on from there plucks
// each string crossed, and the struck one waits until the finger has left it.
function strum(f, sx, sy, t, tap = false) {
  const n = plates[0].length;
  const band = clamp(sy, 0, 0.9999) * CHORDS.length;
  const want = Math.floor(band);
  if (f.plate < 0) { f.plate = want; f.prev = -1; }
  else if (want !== f.plate) {
    const into = band - f.plate;
    if (into < -BAND_HYST || into > 1 + BAND_HYST) { f.plate = want; f.prev = -1; f.armed.fill(1); }
  }
  const s = (sx - STRING_LEFT) / (STRING_RIGHT - STRING_LEFT) * (n - 1);
  const dt = Math.max(1e-3, (t - f.last) / 1000);
  if (f.prev < 0) {
    f.prev = s; f.last = t;
    if (tap) {
      const k = clamp(Math.round(s), 0, n - 1);
      pluckString(f, k);
    }
    return;
  }
  const moved = s - f.prev;
  f.speed = lerp(f.speed, Math.abs(moved) / dt, 0.25);
  f.last = t;
  if (Math.abs(moved) > 1e-5) {
    const lo = Math.max(Math.ceil(Math.min(f.prev, s)), 0), hi = Math.min(Math.floor(Math.max(f.prev, s)), n - 1);
    const order = [];
    for (let k = lo; k <= hi; k++) order.push(k);
    if (moved < 0) order.reverse();
    for (const k of order) {
      if (Math.abs(k - f.prev) < 1e-6 || !f.armed[k]) continue;
      pluckString(f, k);
    }
  }
  for (let k = 0; k < n; k++) if (!f.armed[k] && Math.abs(s - k) > REARM) f.armed[k] = 1;
  f.prev = s;
}

// Every pluck is as loud as the next; how deep this finger is sets only this
// note's colour (a tap is clear, a finger left in the grass brighter still),
// so a soft pick on one plate never dulls another's strum.
function pluckString(f, k) {
  const vel = 0.72;
  post({ t: "pluckNote", note: plates[f.plate][k], vel, delay: 0, bright: 0.7 + 0.3 * depthFor(f) });
  f.armed[k] = 0;
  f.lastPluck = performance.now();
  onPluck(f, vel);
}

function onPluck(f, vel) {
  const col = PLATE_COLORS[f.plate];
  activeScene.pluck(f, col, vel);
  ripples.push({ x: f.world.x, z: f.world.z, age: 0, strength: vel, col });
  if (ripples.length > MAX_RIPPLE) ripples.shift();
  plateGlow[f.plate] = 1;
  if (f.plate !== dronePlate) startDroneOn(f.plate);
}

// ---- depth: how long a finger has stayed down. A quick sweep stays at the
// tips and its notes sound soft-edged; a finger left in the grass sinks over
// about 1.5 s, pressing the blades flat and opening its own notes. Depth never
// changes the volume, and each finger colours only the notes it plays. (Tilt was tried: claude.ai
// artifacts get no motion sensors, 2026-10-25.)
const SINK_DELAY = 0.15, SINK_SECONDS = 1.5;
function depthFor(f) { return f.depth; }

// ---- pointers ------------------------------------------------------------------
const canvas = renderer.domElement;
function pointerXY(e) { return [e.clientX / window.innerWidth, e.clientY / window.innerHeight]; }

// Etch A Sketch: a scene that keeps what is drawn (the sand) is wiped by
// shaking the phone where the browser reports motion (not inside claude.ai,
// which gives pages no motion sensors), or by three fingers landing together.
const landings = [];
function maybeErase() {
  if (activeScene.erase) activeScene.erase();
}
let shakeHits = [];
function onMotion(e) {
  const a = e.acceleration && e.acceleration.x != null ? e.acceleration : null;
  const g = e.accelerationIncludingGravity;
  const mag = a ? Math.hypot(a.x, a.y, a.z) : (g ? Math.abs(Math.hypot(g.x, g.y, g.z) - 9.81) : 0);
  const now = performance.now();
  if (mag > 14) shakeHits.push(now);
  shakeHits = shakeHits.filter((t) => now - t < 900);
  if (shakeHits.length >= 4) { shakeHits = []; maybeErase(); }
}

canvas.addEventListener("pointerdown", (e) => {
  if (!started) return;
  const now = performance.now();
  landings.push(now);
  while (landings.length && now - landings[0] > 220) landings.shift();
  if (landings.length >= 3 && fingers.size >= 2) { landings.length = 0; maybeErase(); }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
  const f = newFinger(e.pointerId);
  f.downAt = performance.now();
  const [sx, sy] = pointerXY(e);
  f.sx = sx; f.sy = sy; f.last = e.timeStamp;
  worldAt(sx, sy, f.world);
  fingers.set(e.pointerId, f);
  strum(f, sx, sy, e.timeStamp, true);

});
canvas.addEventListener("pointermove", (e) => {
  const f = fingers.get(e.pointerId);
  if (!f) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const c of (list.length ? list : [e])) {
    const [sx, sy] = pointerXY(c);
    const prevWorld = f.world.clone();
    if (worldAt(sx, sy, f.world)) {
      const dt = Math.max(1e-3, (c.timeStamp - f.last) / 1000);
      f.vel.lerp(new THREE.Vector2((f.world.x - prevWorld.x) / dt, (f.world.z - prevWorld.z) / dt), 0.3);
    }
    f.sx = sx; f.sy = sy;
    strum(f, sx, sy, c.timeStamp);
  }
  e.preventDefault();
});
function lift(e) {
  const f = fingers.get(e.pointerId);
  if (!f) return;
  f.down = false;
  fingers.delete(e.pointerId);
  leaving.push(f);
}
const leaving = [];
canvas.addEventListener("pointerup", lift);
canvas.addEventListener("pointercancel", lift);
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

// ---- plate names: a faint chord name at the left edge while a finger plays there
let plateGlow = new Float32Array(0), plateAlpha = new Float32Array(0), plateLabels = [];

// Rebuild everything that follows the chord list: the notes under each plate,
// their colours and names. Fingers already down start fresh on the new plates.
function applyChords() {
  CHORDS = settings.chords.map(([r, q]) => [r, q, chordName(r, q)]);
  PLATE_COLORS = CHORDS.map((c, k) => PALETTE[k % PALETTE.length]);
  plates = CHORDS.map((c) => E.plate(c[0], c[1]));
  plateGlow = new Float32Array(CHORDS.length);
  plateAlpha = new Float32Array(CHORDS.length);
  $("plates").textContent = "";
  plateLabels = CHORDS.map((c, k) => {
    const el = document.createElement("div");
    el.className = "plate-name";
    el.textContent = c[2];
    el.style.top = ((k + 0.5) / CHORDS.length * 100) + "%";
    const lit = PLATE_COLORS[k].map((v) => Math.round(lerp(v, 1, 0.25) * 255));
    el.dataset.lit = `rgb(${lit.join(",")})`;
    el.dataset.rest = "rgb(246, 231, 180)";
    el.style.color = el.dataset.rest;
    $("plates").appendChild(el);
    return el;
  });
  for (const f of fingers.values()) { f.plate = -1; f.prev = -1; }
  $("chordline").textContent = CHORDS.map((c) => c[2]).join(" · ") + ", uppifrån och ner";
  if (ctx) startDroneOn(middlePlate());
}
applyChords();

// ---- time of day ---------------------------------------------------------------
const KEYS = [
  { e: -18, hor: [0.035, 0.05, 0.10], light: [0.55, 0.65, 1.0], energy: 0.16, amb: [0.07, 0.09, 0.16], warm: 0.0, fog: 0.03 },
  { e: -5, hor: [0.62, 0.40, 0.40], light: [0.9, 0.5, 0.4], energy: 0.10, amb: [0.20, 0.17, 0.24], warm: 0.2, fog: 0.022 },
  { e: 4, hor: [1.0, 0.70, 0.45], light: [1.0, 0.62, 0.32], energy: 1.1, amb: [0.32, 0.30, 0.34], warm: 0.9, fog: 0.016 },
  { e: 16, hor: [0.90, 0.88, 0.80], light: [1.0, 0.86, 0.66], energy: 1.5, amb: [0.36, 0.42, 0.50], warm: 0.35, fog: 0.012 },
  { e: 45, hor: [0.70, 0.84, 0.97], light: [1.0, 0.96, 0.88], energy: 1.7, amb: [0.40, 0.47, 0.56], warm: 0.0, fog: 0.010 },
];
let hour = 15;
function sunDirection(h) {
  let a;
  if (h >= 5 && h <= 21) a = (h - 5) / 16 * Math.PI;
  else a = Math.PI + (((h - 21) % 24 + 24) % 24) / 8 * Math.PI;
  let elev = Math.sin(a) * (Math.sin(a) < 0 ? 18 : 52) * Math.PI / 180;
  const flat = Math.sin(a) < 0 ? new THREE.Vector3(Math.cos(a), 0, Math.sin(a)) : new THREE.Vector3(Math.cos(a), 0, -Math.sin(a));
  return flat.multiplyScalar(Math.cos(elev)).add(new THREE.Vector3(0, Math.sin(elev), 0)).normalize();
}
function applyHour(h) {
  hour = ((h % 24) + 24) % 24;
  const sun = sunDirection(hour);
  const elev = Math.asin(sun.y) * 180 / Math.PI;
  let k = KEYS[KEYS.length - 1];
  if (elev <= KEYS[0].e) k = KEYS[0];
  else for (let i = 1; i < KEYS.length; i++) if (elev <= KEYS[i].e) {
    const a = KEYS[i - 1], b = KEYS[i], t = smooth(a.e, b.e, elev);
    k = {};
    for (const key in a) k[key] = Array.isArray(a[key]) ? a[key].map((v, j) => lerp(v, b[key][j], t)) : lerp(a[key], b[key], t);
    break;
  }
  let dir = sun;
  const night = 1 - smooth(-8, -3, elev);
  if (night > 0) dir = sun.clone().lerp(new THREE.Vector3(-0.35, 0.55, -0.75).normalize(), night).normalize();
  lightUniforms.uSunDir.value.copy(dir);
  lightUniforms.uSunCol.value.setRGB(k.light[0] * k.energy, k.light[1] * k.energy, k.light[2] * k.energy);
  lightUniforms.uAmbient.value.setRGB(...k.amb);
  lightUniforms.uFogCol.value.setRGB(...k.hor);
  lightUniforms.uFogDensity.value = k.fog;
  lightUniforms.uWarm.value = k.warm;
  const fogSrgb = k.hor.map((v) => Math.pow(clamp(v, 0, 1), 1 / 2.2));
  renderer.setClearColor(new THREE.Color(...fogSrgb));
  const hh = Math.floor(hour), mm = Math.round((hour - hh) * 60) % 60;
  $("clock").innerHTML = `<span class="pre">Tid </span>${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}

// ---- camera views ----------------------------------------------------------------
let viewIndex = 0, glide = 1, from = null, to = null;
function viewState(v) { return { pos: new THREE.Vector3(...v.pos), look: new THREE.Vector3(...v.look), fov: v.fov }; }
function goToView(i, instant) {
  viewIndex = ((i % VIEWS.length) + VIEWS.length) % VIEWS.length;
  from = to ? { pos: camera.position.clone(), look: to.look.clone(), fov: camera.fov } : viewState(VIEWS[viewIndex]);
  to = viewState(VIEWS[viewIndex]);
  if (from && to && glide < 1) from.look = currentLook.clone();
  glide = instant ? 1 : 0;
  $("view").innerHTML = "<span class=\"pre\">Vy: </span>" + VIEWS[viewIndex].name;
}
const currentLook = new THREE.Vector3();
function placeCamera(dt, time) {
  if (glide < 1) glide = Math.min(1, glide + dt / 2.5);
  const e = glide * glide * (3 - 2 * glide);
  const pos = from.pos.clone().lerp(to.pos, e);
  currentLook.copy(from.look).lerp(to.look, e);
  pos.y += Math.sin(e * Math.PI) * 0.12 * from.pos.distanceTo(to.pos);
  pos.add(new THREE.Vector3(Math.sin(time * 0.21), Math.sin(time * 0.17 + 1.3) * 0.6, Math.cos(time * 0.13)).multiplyScalar(0.05));
  camera.fov = lerp(from.fov, to.fov, e);
  camera.position.copy(pos);
  camera.lookAt(currentLook);
  camera.updateProjectionMatrix();
}

// ---- resize ------------------------------------------------------------------------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  for (const sc of SCENES) sc.resize();
}
window.addEventListener("resize", resize);

// ---- the frame ---------------------------------------------------------------------
let started = false, last = performance.now(), clockTime = 0;
let deepestDepth = 0;
let fpsTime = 0, fpsFrames = 0;

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  clockTime += dt;
  placeCamera(dt, clockTime);

  // each finger sinks the longer it stays down
  let deepest = 0;
  for (const f of fingers.values()) {
    f.depth = smooth(0, 1, ((now - f.downAt) / 1000 - SINK_DELAY) / SINK_SECONDS);
    f.speed *= Math.exp(-dt / 0.25);
    deepest = Math.max(deepest, depthFor(f));
  }
  deepestDepth = deepest;

  // hand the fingers to the scene; each finger's glow sits on its surface
  const touches = [];
  const viewScale = clamp(camera.position.y / 11, 0.6, 1.6);
  for (const f of fingers.values()) {
    const sp = f.vel.length();
    const k = sp > 1e-3 ? clamp(sp / 3, 0, 1) / sp : 0;
    if (!f.lastWorld) f.lastWorld = f.world.clone();
    touches.push({ x: f.world.x, z: f.world.z, px: f.lastWorld.x, pz: f.lastWorld.z, radius: (0.5 + 0.35 * depthFor(f)) * viewScale,
                   press: 0.15 + 0.85 * depthFor(f), dx: f.vel.x * k, dz: f.vel.y * k, strength: 0.45,
                   speed: sp, depth: depthFor(f), finger: f });
    f.lastWorld.copy(f.world);
    f.vel.multiplyScalar(Math.exp(-dt / 0.15));
    f.sprite.position.set(f.world.x, activeScene.glowHeight, f.world.z);
    f.sprite.material.opacity = lerp(f.sprite.material.opacity, 0.25 + 0.6 * depthFor(f), 0.2);
    f.sprite.scale.setScalar((0.6 + 1.1 * depthFor(f)) * viewScale);
  }
  for (let i = leaving.length - 1; i >= 0; i--) {
    const f = leaving[i];
    f.sprite.material.opacity *= Math.exp(-dt / 0.2);
    if (f.sprite.material.opacity < 0.01) { scene.remove(f.sprite); f.sprite.material.dispose(); leaving.splice(i, 1); }
  }
  listenToMusic(dt);
  activeScene.update(dt, touches, clockTime);

  // ripples
  const rings = rippleMat.uniforms.uRings.value, cols = rippleMat.uniforms.uColors.value;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].age += dt; if (ripples[i].age > 4) ripples.splice(i, 1); }
  for (let i = 0; i < MAX_RIPPLE; i++) {
    const r = ripples[i];
    if (r) { rings[i].set(r.x, r.z, r.age, r.strength); cols[i].set(...r.col); }
    else rings[i].set(0, 0, 0, 0);
  }
  passQuad.material = rippleMat;
  renderer.setRenderTarget(rippleRT);
  renderer.render(passScene, passCam);
  renderer.setRenderTarget(null);

  stepPollen(dt);

  for (let k = 0; k < CHORDS.length; k++) {
    let want = 0;
    for (const f of fingers.values()) if (f.plate === k) want = Math.max(want, 0.5 + 0.5 * Math.exp(-(performance.now() - f.lastPluck) / 500));
    plateGlow[k] = Math.max(0, plateGlow[k] - dt);
    plateAlpha[k] = clamp(lerp(plateAlpha[k], Math.max(want, plateGlow[k] * 0.5), want > plateAlpha[k] ? 0.25 : 0.04), 0, 1);
    // always readable; the plate a finger is on lights up and grows a little
    const el = plateLabels[k], a = plateAlpha[k];
    el.style.opacity = (0.72 + 0.28 * a).toFixed(3);
    el.style.setProperty("--lift", (1 + 0.12 * a).toFixed(3));
    el.style.setProperty("--pill", (0.45 + 0.25 * a).toFixed(3));
    el.style.color = a > 0.05 ? el.dataset.lit : el.dataset.rest;
  }

  renderer.render(scene, camera);

  // keep the frame rate: fewer blades on a struggling phone, more on a strong one
  fpsTime += dt; fpsFrames++;
  if (fpsTime > 2.5) {
    const fps = fpsFrames / fpsTime;
    activeScene.tune(fps);
    window.__tg = { fps: Math.round(fps), scene: activeScene.id, ...activeScene.stats(), worklet: !!node, floatTargets, depth: +deepestDepth.toFixed(2) };
    fpsTime = 0; fpsFrames = 0;
  }
  requestAnimationFrame(frame);
}

// ---- start -----------------------------------------------------------------------
$("begin").addEventListener("click", async () => {
  $("start").classList.add("gone");
  $("controls").hidden = false;
  started = true;
  try {
    if (typeof DeviceMotionEvent !== "undefined" && DeviceMotionEvent.requestPermission) {
      if (await DeviceMotionEvent.requestPermission() === "granted") window.addEventListener("devicemotion", onMotion);
    } else window.addEventListener("devicemotion", onMotion);
  } catch (e) { /* no motion here: three fingers still wipe the sand */ }
  try { await startAudio(); } catch (e) { showError("Ljudet kunde inte starta: " + e.message); }
  try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}
  const hint = $("hint");
  hint.textContent = "Dra i sidled · tryck för en ton · höjden byter ackord";
  hint.hidden = false;
  setTimeout(() => { hint.style.opacity = "0"; }, 6500);
});

// A hidden page goes quiet: switching app, locking the phone or leaving the
// tab must not leave the drone playing somewhere unseen.
document.addEventListener("visibilitychange", () => {
  if (!ctx) return;
  if (document.hidden) { post({ t: "alloff" }); ctx.suspend(); dronePlate = -1; }
  else ctx.resume().then(() => startDroneOn(middlePlate()));
});
window.addEventListener("pagehide", () => { if (ctx) ctx.close(); });

// ---- settings: the drone and the chords under the plates ----------------------
function openSettings(open) {
  $("settings").hidden = !open;
  if (open) { renderChordList(); $("settings-done").focus(); }
}

// a soft roll over a plate, so a changed chord can be heard at once
function previewPlate(k) {
  if (!ctx) return;
  plates[k].forEach((note, i) => post({ t: "pluckNote", note, vel: 0.45, delay: i * 0.035 }));
  startDroneOn(k);
}

function renderChordList() {
  const list = $("chord-list");
  list.textContent = "";
  settings.chords.forEach(([r, q], k) => {
    const row = document.createElement("div");
    row.className = "chord-row";
    const dot = document.createElement("span");
    dot.className = "dot";
    const c = PALETTE[k % PALETTE.length].map((v) => Math.round(lerp(v, 1, 0.3) * 255));
    dot.style.background = `rgb(${c.join(",")})`;
    const root = document.createElement("select");
    root.id = `chord-root-${k}`;
    root.setAttribute("aria-label", `Grundton, ackord ${k + 1}`);
    NOTE_NAMES.forEach((name, i) => root.add(new Option(name, i, false, i === r)));
    const kind = document.createElement("select");
    kind.id = `chord-kind-${k}`;
    kind.setAttribute("aria-label", `Typ, ackord ${k + 1}`);
    KINDS.forEach(([, name], i) => kind.add(new Option(name, i, false, i === q)));
    const change = () => {
      settings.chords[k] = [parseInt(root.value, 10), parseInt(kind.value, 10)];
      saveSettings(); applyChords(); previewPlate(k);
    };
    root.addEventListener("change", change);
    kind.addEventListener("change", change);
    const remove = document.createElement("button");
    remove.className = "chip"; remove.type = "button"; remove.textContent = "Ta bort";
    remove.disabled = settings.chords.length <= 1;
    remove.addEventListener("click", () => {
      settings.chords.splice(k, 1);
      saveSettings(); applyChords(); renderChordList();
    });
    row.append(dot, root, kind, remove);
    list.appendChild(row);
  });
  $("chord-add").disabled = settings.chords.length >= MAX_PLATES;
}

$("settings-open").addEventListener("click", () => openSettings(true));
$("settings-done").addEventListener("click", () => openSettings(false));
$("settings").addEventListener("click", (e) => { if (e.target === $("settings")) openSettings(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("settings").hidden) openSettings(false); });
$("chord-add").addEventListener("click", () => {
  if (settings.chords.length >= MAX_PLATES) return;
  const [r, q] = settings.chords[settings.chords.length - 1];
  settings.chords.push([(r + 7) % 12, q]);           // a fifth up from the last
  saveSettings(); applyChords(); renderChordList(); previewPlate(settings.chords.length - 1);
});
$("chord-reset").addEventListener("click", () => {
  settings.chords = DEFAULT_CHORDS.map((c) => c.slice());
  saveSettings(); applyChords(); renderChordList();
});
const VOICE_NAMES = ["Omni (OM-84)", "Harpa", "Vibrafon", "Gitarr", "Cello", "Ney", "Juno"];
VOICE_NAMES.forEach((name, i) => $("voice").add(new Option(name, i, false, i === settings.voice)));
$("ring").value = settings.ring;
$("voice").addEventListener("change", (e) => {
  settings.voice = parseInt(e.target.value, 10);
  rememberSound(); saveSettings(); sendStrings(); previewPlate(dronePlate >= 0 ? dronePlate : middlePlate());
});
$("ring").addEventListener("input", (e) => { settings.ring = parseFloat(e.target.value); rememberSound(); saveSettings(); sendStrings(); });
$("ring").addEventListener("change", () => previewPlate(dronePlate >= 0 ? dronePlate : middlePlate()));
$("drone-on").checked = settings.drone;
$("drone-level").value = settings.droneLevel;
$("drone-bright").value = settings.droneBright;
$("drone-on").addEventListener("change", (e) => { settings.drone = e.target.checked; saveSettings(); sendDrone(); });
$("drone-level").addEventListener("input", (e) => { settings.droneLevel = parseFloat(e.target.value); if (!settings.drone && settings.droneLevel > 0) { settings.drone = true; $("drone-on").checked = true; } saveSettings(); sendDrone(); });
$("drone-bright").addEventListener("input", (e) => { settings.droneBright = parseFloat(e.target.value); saveSettings(); sendDrone(); });

for (const sc of SCENES) {
  const b = document.createElement("button");
  b.className = "chip scene-pick"; b.type = "button"; b.textContent = sc.name; b.dataset.scene = sc.id;
  b.addEventListener("click", () => setScene(sc.id));
  $("scene-picks").appendChild(b);
}

$("scene-next").addEventListener("click", () => setScene(SCENES[(SCENES.indexOf(activeScene) + 1) % SCENES.length].id));
$("view").addEventListener("click", () => goToView(viewIndex + 1, false));
$("clock").addEventListener("click", () => { $("timerow").hidden = !$("timerow").hidden; });
$("hour").addEventListener("input", (e) => applyHour(parseFloat(e.target.value)));

goToView(0, true);
applyHour(15);
setScene(settings.scene);
resize();
requestAnimationFrame((t) => { last = t; frame(t); });
</script>

</body></html>
