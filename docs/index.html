<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Touch Grass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap">
<style>
/* One full-screen meadow; the few controls float over it like seed heads. */
:root {
  --meadow: #20351a;      /* page ground behind the canvas, the meadow's shade */
  --dusk: #0d160b;        /* the start screen's veil */
  --pollen: #f6e7b4;      /* light, text on the meadow */
  --pollen-dim: rgba(246, 231, 180, 0.62);
  --glass: rgba(14, 24, 12, 0.42);
  --glass-edge: rgba(246, 231, 180, 0.18);
  --font-title: "Comfortaa", "Nunito Sans", ui-rounded, system-ui, sans-serif;
  --font-ui: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--meadow);
  color: var(--pollen);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#start {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 60%, rgba(13, 22, 11, 0.35), rgba(13, 22, 11, 0.82));
  transition: opacity 0.9s ease;
}
#start.gone { opacity: 0; pointer-events: none; }
.start-card { display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 30rem; }
.start-card h1 {
  margin: 0; font-family: var(--font-title); font-weight: 600;
  font-size: clamp(2.4rem, 9vw, 4.2rem); letter-spacing: 0.02em; line-height: 1;
  text-wrap: balance;
}
.start-card p { margin: 0; color: var(--pollen-dim); font-size: 1rem; line-height: 1.5; text-wrap: balance; }
#begin {
  font: 600 1.05rem var(--font-ui); color: var(--dusk);
  background: var(--pollen); border: 0; border-radius: 999px;
  padding: 14px 34px; cursor: pointer; letter-spacing: 0.03em;
}
#begin:focus-visible, .chip:focus-visible { outline: 2px solid var(--pollen); outline-offset: 3px; }
#start .note { font-size: 0.82rem; color: var(--pollen-dim); }

#controls {
  position: fixed; z-index: 4;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
}
.chip {
  font: 600 0.85rem var(--font-ui); color: var(--pollen);
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#timerow {
  display: flex; align-items: center; gap: 10px;
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px;
  padding: 6px 14px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-variant-numeric: tabular-nums; font-size: 0.85rem;
}
#hour { width: min(46vw, 200px); accent-color: var(--pollen); }

#plates { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.plate-name {
  position: absolute; left: calc(12px + env(safe-area-inset-left, 0px));
  transform: translateY(-50%) scale(var(--lift, 1)); transform-origin: left center;
  font-family: var(--font-title); font-size: clamp(1.15rem, 5vw, 1.7rem); font-weight: 600; line-height: 1;
  padding: 7px 13px 8px; border-radius: 999px;
  background: rgba(10, 18, 8, var(--pill, 0.45));
  border: 1px solid rgba(246, 231, 180, 0.16);
  text-shadow: 0 1px 3px rgba(5, 10, 3, 0.8);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  opacity: 0.7;
}
/* Portrait: the controls in one row along the top, their labels shortened
   ("Scen:", "Vy:", "Tid" drop away) so all four fit a phone's width.
   Landscape keeps them stacked in the corner. */
@media (orientation: portrait) {
  #controls {
    left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
    top: calc(10px + env(safe-area-inset-top, 0px));
    flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 5px;
  }
  #controls .chip { font-size: 0.78rem; padding: 7px 8px; }
  #controls .pre { display: none; }
  #timerow { flex-basis: 100%; justify-content: center; }
}
#hint {
  position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px);
  font-size: 0.9rem; color: var(--pollen-dim); text-align: center; text-shadow: 0 1px 6px rgba(10, 20, 6, 0.7);
  transition: opacity 1.5s ease; pointer-events: none;
}
#err { position: fixed; inset: auto 16px 16px 16px; z-index: 6; color: var(--pollen); font-size: 0.9rem; }
#settings {
  position: fixed; inset: 0; z-index: 6;
  display: grid; align-items: end; justify-items: center;
  background: rgba(8, 14, 6, 0.45);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet {
  box-sizing: border-box; width: min(100%, 28rem); max-height: 82vh; overflow-y: auto;
  margin-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: rgba(16, 26, 13, 0.94); border: 1px solid var(--glass-edge); border-radius: 22px;
  padding: 18px 18px 20px; display: grid; gap: 18px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet h2 { margin: 0; font: 600 1.25rem var(--font-title); }
.sheet h3 { margin: 0 0 10px; font: 600 0.78rem var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--pollen-dim); }
.sheet section { display: grid; gap: 10px; }
.setting { display: grid; grid-template-columns: 5.5rem 1fr; align-items: center; gap: 12px; font-size: 0.95rem; }
.setting input[type=range] { width: 100%; accent-color: var(--pollen); }
.switch { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; }
.switch input { width: 20px; height: 20px; accent-color: var(--pollen); }
.chord-row { display: grid; grid-template-columns: 12px 1fr 1fr auto; align-items: center; gap: 8px; }
.chord-row .dot { width: 12px; height: 12px; border-radius: 50%; }
.pick, .chord-row select {
  font: 600 0.95rem var(--font-ui); color: var(--pollen); background: rgba(246, 231, 180, 0.08);
  border: 1px solid var(--glass-edge); border-radius: 10px; padding: 8px 6px; min-width: 0; box-sizing: border-box; width: 100%;
}
.chord-row button, .row-buttons button { font-size: 0.8rem; padding: 7px 11px; }
.chord-row button:disabled, .row-buttons button:disabled { opacity: 0.35; cursor: default; }
.row-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.scene-pick { font-size: 0.95rem; padding: 9px 18px; }
.scene-pick[aria-pressed="true"] { background: var(--pollen); color: var(--dusk); border-color: var(--pollen); }
@media (prefers-reduced-motion: reduce) { #start, #hint { transition: none; } }
</style>

<div id="stage"></div>
<div id="plates"></div>
<div id="controls" hidden>
  <button class="chip" id="settings-open" type="button">Inställningar</button>
  <button class="chip" id="scene-next" type="button"><span class="pre">Scen: </span>Äng</button>
  <button class="chip" id="view" type="button"><span class="pre">Vy: </span>Ovanifrån</button>
  <button class="chip" id="clock" type="button"><span class="pre">Tid </span>15:00</button>
  <div id="timerow" hidden>
    <label for="hour">Tid</label>
    <input id="hour" type="range" min="0" max="24" step="0.05" value="15">
  </div>
</div>
<div id="settings" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header>
      <h2 id="settings-title">Inställningar</h2>
      <button class="chip" id="settings-done" type="button">Klar</button>
    </header>
    <section>
      <h3>Scen</h3>
      <div class="row-buttons" id="scene-picks"></div>
    </section>
    <section>
      <h3>Strängar</h3>
      <div class="setting"><label for="voice">Ljud</label><select id="voice" class="pick"></select></div>
      <div class="setting"><label for="ring">Klingtid</label><input id="ring" type="range" min="0.8" max="10" step="0.1"></div>
    </section>
    <section>
      <h3>Drone</h3>
      <label class="switch"><input type="checkbox" id="drone-on"> Drone på</label>
      <div class="setting"><label for="drone-level">Volym</label><input id="drone-level" type="range" min="0" max="1" step="0.01"></div>
      <div class="setting"><label for="drone-bright">Klang</label><input id="drone-bright" type="range" min="0.15" max="0.8" step="0.01"></div>
    </section>
    <section>
      <h3>Ackord, uppifrån och ner</h3>
      <div id="chord-list" style="display:grid;gap:8px"></div>
      <div class="row-buttons">
        <button class="chip" id="chord-add" type="button">Lägg till ackord</button>
        <button class="chip" id="chord-reset" type="button">Återställ G · D · A · Em</button>
      </div>
    </section>
  </div>
</div>
<div id="hint" hidden></div>
<div id="start">
  <div class="start-card">
    <h1>Touch Grass</h1>
    <p>Dra fingrarna över ytan. Höjden på skärmen väljer ackord, i sidled knäpper du strängarna och ett tryck slår an en sträng. Låt fingret ligga kvar så ljusnar klangen.</p>
    <button id="begin" type="button">Börja</button>
    <span class="note" id="chordline">G · D · A · Em, uppifrån och ner</span>
  </div>
</div>
<div id="err" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Touch Grass's sound engine for the web: a line-by-line port of gdext/src
// (GrassEngine.h and the Chordtroller headers it plays: PluckVoice,
// VoiceSpec, the Omnichord plate from ChordRing, Ensemble, TempoDelay and a
// JunoVoice for the drone). Keep the two in step; test/enginetest.mjs renders
// the same score through both and compares them.
//
// Everything lives inside one self-contained factory so the page can run it
// in an AudioWorklet (from a blob made of this function's own source) or, if
// the browser refuses that, on the main thread.

function TouchGrassEngine() {
  "use strict";
  const PI = 3.14159265358979;
  const TAU = 2 * PI;

  // ---- VoiceSpec ------------------------------------------------------------
  const PULSE = 0, SAW = 1, SINE = 2;
  const VOICES = [
    { name: "OMNI",     wave: PULSE, pw: 0.35, filterMultiple: 7.0,  decayScale: 1.00, attack: 0.0020, detune: 3.0 },
    { name: "HARPA",    wave: SAW,   pw: 0.0,  filterMultiple: 5.0,  decayScale: 1.15, attack: 0.0030, detune: 2.0 },
    { name: "VIBRAFON", wave: SINE,  pw: 0.0,  filterMultiple: 12.0, decayScale: 1.60, attack: 0.0040, detune: 1.5 },
    { name: "GITARR",   wave: PULSE, pw: 0.20, filterMultiple: 9.0,  decayScale: 0.70, attack: 0.0015, detune: 4.0 },
    // not a pluck: each string is a short bow stroke on Chordtroller's bowed string
    { name: "CELLO", bowed: true, decayScale: 1.0 },
    // not a pluck either: each string is a breath into a reed flute
    { name: "NEY", blown: true, decayScale: 1.0 },
    // Chordtroller's Juno voice played as a keyboard: each string a key held a while
    { name: "JUNO", synth: true, decayScale: 1.0 },
  ];

  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);

  function polyBlep(t, dt) {
    if (dt <= 0) return 0;
    if (t < dt) { t /= dt; return t + t - t * t - 1; }
    if (t > 1 - dt) { t = (t - 1) / dt; return t * t + t + t + 1; }
    return 0;
  }

  // ---- PluckVoice -------------------------------------------------------------
  class PluckVoice {
    constructor(sr) { this.sr = sr; this.reset(); }
    reset() {
      this.active = false; this.attacking = false; this.env = 0; this.lowpass = 0;
      this.phase1 = 0; this.phase2 = 0.37; this.inc1 = 0; this.inc2 = 0;
      this.target = 1; this.attackStep = 0.01; this.decayCoef = 0.999; this.filterG = 0.5;
      this.spec = null; this.stringIdx = -1; this.stamp = 0;
    }
    // bright 0..1 is this note's own colour: 1 the voice as designed, lower
    // closes its lowpass (about three octaves down at 0). Each note keeps it,
    // so one finger playing softly never dulls another's strum.
    start(freq, velocity, decayCoef, spec, stringIndex, stamp, bright = 1) {
      const wasActive = this.active;
      this.spec = spec;
      const spread = Math.pow(2, spec.detune / 1200);
      this.inc1 = freq / spread / this.sr;
      this.inc2 = freq * spread / this.sr;
      if (!wasActive) { this.phase1 = 0; this.phase2 = 0.37; this.lowpass = 0; }
      // a darker note is boosted back to the same loudness: brightness is colour, not volume
      this.target = clamp(velocity, 0, 1) * Math.pow(2, (1 - clamp(bright, 0, 1)) * 0.95);
      this.attackStep = this.target / Math.max(1, this.sr * spec.attack);
      this.attacking = true;
      this.decayCoef = decayCoef;
      const cutoff = clamp(clamp(freq * spec.filterMultiple, 800, 14000) * Math.pow(2, (clamp(bright, 0, 1) - 1) * 3.2), 250, 16000);
      this.filterG = 1 - Math.exp(-2 * PI * cutoff / this.sr);
      this.stringIdx = stringIndex;
      this.stamp = stamp;
      this.active = true;
    }
    stopQuickly() {
      if (!this.active) return;
      this.attacking = false;
      this.decayCoef = Math.pow(0.001, 1 / Math.max(1, this.sr * 0.005));
    }
    osc(phase, inc) {
      const s = this.spec;
      if (s.wave === SINE) return Math.sin(TAU * phase);
      if (s.wave === SAW) return (2 * phase - 1) - polyBlep(phase, inc);
      let v = phase < s.pw ? 1 : -1;
      v += polyBlep(phase, inc);
      let falling = phase + (1 - s.pw);
      if (falling >= 1) falling -= 1;
      return v - polyBlep(falling, inc);
    }
    process() {
      if (this.attacking) {
        this.env += this.attackStep;
        if (this.env >= this.target) { this.env = this.target; this.attacking = false; }
      } else {
        this.env *= this.decayCoef;
        if (this.env < 1e-4) { this.active = false; this.env = 0; return 0; }
      }
      const raw = (this.osc(this.phase1, this.inc1) + this.osc(this.phase2, this.inc2)) * 0.5;
      this.phase1 += this.inc1; if (this.phase1 >= 1) this.phase1 -= 1;
      this.phase2 += this.inc2; if (this.phase2 >= 1) this.phase2 -= 1;
      const g = clamp(this.filterG * (0.35 + 0.65 * this.env), 0.0005, 0.99);
      this.lowpass += g * (raw - this.lowpass);
      return this.lowpass * this.env;
    }
  }

  // ---- The Omnichord plate (ChordRing.h StringSet) ----------------------------
  // quality: 0 major, 1 minor, 2 dominant 7, 3 major 7, 4 minor 7
  const THIRD = [4, 3, 4, 4, 3];
  const COLOUR = [7, 7, 10, 11, 10];

  function plate(root, quality) {
    const pc = ((root % 12) + 12) % 12;
    const q = clamp(quality | 0, 0, 4);
    const base = pc <= 5 ? 48 + pc : 36 + pc;
    const colourOffset = (base + COLOUR[q] - 12) >= 42 ? COLOUR[q] - 12 : COLOUR[q];
    const out = [];
    for (let o = 0; o < 4; o++) {
      const r = base + 12 * o;
      out.push(r, r + THIRD[q], r + colourOffset);
    }
    out.push(base + 48);
    return out;
  }

  // ---- Ensemble ---------------------------------------------------------------
  class Ensemble {
    constructor(sr) {
      this.sr = sr;
      this.buf = new Float32Array(Math.floor(sr * 0.05) + 4);
      this.w = 0; this.phase = 0; this.rate = 0.45; this.mix = 0.5;
      this.lpL = 0; this.lpR = 0;
      this.lpc = 1 - Math.exp(-2 * PI * 7000 / sr);
    }
    tri(p) { p -= Math.floor(p); return 1 - Math.abs(2 * p - 1); }
    tap(ms) {
      const size = this.buf.length;
      let pos = this.w - ms * 0.001 * this.sr;
      while (pos < 0) pos += size;
      const a = pos | 0, b = (a + 1) % size, f = pos - a;
      return this.buf[a] * (1 - f) + this.buf[b] * f;
    }
    process(x, out) {
      this.buf[this.w] = x;
      this.phase += this.rate / this.sr;
      if (this.phase >= 1) this.phase -= 1;
      const wl = this.tap(1.2 + this.tri(this.phase) * 4.8);
      const wr = this.tap(1.2 + this.tri(this.phase + 0.5) * 4.8);
      this.lpL += this.lpc * (wl - this.lpL);
      this.lpR += this.lpc * (wr - this.lpR);
      out[0] = x * (1 - this.mix) + this.lpL * this.mix;
      out[1] = x * (1 - this.mix) + this.lpR * this.mix;
      if (++this.w >= this.buf.length) this.w = 0;
    }
  }

  // ---- TempoDelay: ping-pong, dotted eighth, darker each time round ------------
  class TempoDelay {
    constructor(sr) {
      this.sr = sr;
      this.L = new Float32Array(Math.floor(sr * 2.5) + 4);
      this.R = new Float32Array(this.L.length);
      this.w = 0; this.lowL = 0; this.lowR = 0; this.send = 0; this.fb = 0.3;
      this.target = 11025; this.current = 11025;
    }
    setTiming(bpm, division) {
      const beats = [0.5, 0.75, 1.0][clamp(division, 0, 2)];
      const sec = 60 / Math.max(40, bpm) * beats;
      this.target = Math.min(sec * this.sr, this.L.length - 4);
    }
    setAmount(send, fb) { this.send = clamp(send, 0, 1); this.fb = clamp(fb, 0, 0.85); }
    read(line, d) {
      let pos = this.w - d;
      while (pos < 0) pos += line.length;
      const a = pos | 0, b = (a + 1) % line.length, f = pos - a;
      return line[a] * (1 - f) + line[b] * f;
    }
    process(io) {
      this.current += (this.target - this.current) * 0.0005;
      const wl = this.read(this.L, this.current), wr = this.read(this.R, this.current);
      this.lowL += 0.35 * (wl - this.lowL);
      this.lowR += 0.35 * (wr - this.lowR);
      const input = (io[0] + io[1]) * 0.5 * this.send;
      this.L[this.w] = input + this.lowR * this.fb;
      this.R[this.w] = this.lowL * this.fb;
      if (++this.w >= this.L.length) this.w = 0;
      io[0] += wl; io[1] += wr;
    }
  }

  // ---- JunoVoice (PAD patch) for the drone ------------------------------------
  const PAD = { saw: 0.80, pulse: 0.45, sub: 0.30, noise: 0.0, pw: 0.50, pwm: 0.35, lfoRate: 0.45,
                env: 0.22, key: 0.30, hpf: 0.05, A: 0.55, D: 1.20, S: 0.80, R: 1.40, level: 0.55 };
  const IDLE = 0, ATTACK = 1, DECAY = 2, SUSTAIN = 3, RELEASE = 4;

  function softClip(x) { x = clamp(x, -3, 3); return x * (27 + x * x) / (27 + 9 * x * x); }

  // The clouds' patch: PAD's oscillators with a quicker, brighter bloom, so a
  // strum still articulates each string, and a release the ring time sets
  const CLOUD = { saw: 0.75, pulse: 0.50, sub: 0.25, noise: 0.0, pw: 0.50, pwm: 0.45, lfoRate: 0.5,
                  env: 0.40, key: 0.30, hpf: 0.10, A: 0.035, D: 1.40, S: 0.55, R: 1.60, level: 0.60 };

  class JunoVoice {
    constructor(sr, patch = PAD) {
      this.sr = sr; this.p = patch;
      const coef = (s) => Math.pow(0.001, 1 / Math.max(1, sr * s));
      this.attackStep = 1 / Math.max(1, sr * patch.A);
      this.decayCoef = coef(patch.D); this.releaseCoef = coef(patch.R);
      this.hpfCoef = 1 - Math.exp(-2 * PI * (20 * Math.pow(2, patch.hpf * 5.3)) / sr);
      this.active = false; this.gateOn = false; this.env = 0; this.stage = IDLE;
      this.s1 = this.s2 = this.s3 = this.s4 = 0; this.hpLow = 0;
      this.phase = 0; this.subPhase = 0; this.inc = 0; this.note = -1; this.vel = 1; this.stamp = 0;
      this.G = 0.5; this.g = 1; this.tick = 0;   // filter coefficients, refreshed every 16 samples
    }
    noteOn(note, vel, order) {
      if (!this.active) { this.phase = 0; this.subPhase = 0; }
      this.note = note; this.vel = vel;
      this.inc = 440 * Math.pow(2, (note - 69) / 12) / this.sr;
      this.stage = ATTACK; this.active = true; this.gateOn = true; this.stamp = order;
    }
    noteOff() { if (!this.gateOn) return; this.gateOn = false; this.stage = RELEASE; }
    setRelease(seconds) { this.releaseCoef = Math.pow(0.001, 1 / Math.max(1, this.sr * seconds)); }
    advance() {
      const p = this.p;
      switch (this.stage) {
        case ATTACK: this.env += this.attackStep; if (this.env >= 1) { this.env = 1; this.stage = DECAY; } break;
        case DECAY: this.env = p.S + (this.env - p.S) * this.decayCoef; if (Math.abs(this.env - p.S) < 1e-3) this.stage = SUSTAIN; break;
        case SUSTAIN: this.env = p.S; if (this.env <= 1e-4) { this.active = false; this.stage = IDLE; } break;
        case RELEASE: this.env *= this.releaseCoef; if (this.env < 1e-4) { this.env = 0; this.active = false; this.stage = IDLE; } break;
      }
    }
    process(lfo, cutoff, resonance, envScale) {
      this.advance();

      const saw = (2 * this.phase - 1) - polyBlep(this.phase, dt);

      // the pad's cutoff moves slowly (its envelope is seconds long), so the
      // tan and pow are only worked out every 16 samples: on a phone they were
      // most of the cost
      if ((this.tick++ & 15) === 0) {

  // ---- the cello: Chordtroller's bowed string (dsp/BowedString.h, StringEngine.h) ----
  // A digital waveguide with the bow as a friction junction (Smith and Woodhouse's
  // hyperbolic friction, solved exactly as a quadratic, hysteresis kept). Ported
  // line by line; what differs is only the playing: here every plucked string is
  // a short stroke, the bow set down, drawn for a while, lifted, and the string
  // left to ring. The lessons that made it play clean carry over: loss as a fixed
  // share per period, the loop's lowpass at a multiple of the pitch, force from
  // the speed the bow is asked for, every stroke leaning in from a third of the
  // limit, and the string run at twice the sample rate.

  class FractionalDelay {
    constructor(maxDelay) {
      let size = 16;
      while (size < maxDelay + 8) size <<= 1;

    }
    clear() { this.buf.fill(0); }
    push(x) { this.buf[this.w] = x; this.w = (this.w + 1) & this.mask; }

    read(delay) {

      const whole = delay | 0, f = delay - whole, b = this.buf, m = this.mask, w = this.w;
      const ym1 = b[(w - (whole - 1)) & m], y0 = b[(w - whole) & m], y1 = b[(w - whole - 1) & m], y2 = b[(w - whole - 2) & m];
      const fm1 = f + 1, f1 = f - 1, f2 = f - 2;
      return ym1 * (-f * f1 * f2 / 6) + y0 * (fm1 * f1 * f2 * 0.5) + y1 * (-fm1 * f * f2 * 0.5) + y2 * (fm1 * f * f1 / 6);
    }
  }

  const MU_S = 0.8, MU_D = 0.3, MU_SPAN = 0.5, SLIP_KNEE = 0.08;
  class BowedString {
    constructor(sr) {
      this.sr = sr;

      this.toBridge = new FractionalDelay(longest);

      this.loopGain = 0.99; this.pole = 0.2; this.lowpassDelay = 0;

    }
    reset() { this.toFinger.clear(); this.toBridge.clear(); this.lp = 0; this.sticking = false; }
    // loss as log10 of the gain per round trip; the loop lowpass's delay is taken
    // off the finger side so the string is not flat
    setLosses(hz, logLoss, lowpassHz) {
      hz = Math.max(hz, 20);
      this.loopGain = Math.pow(10, -logLoss);
      this.pole = Math.exp(-2 * PI * Math.min(lowpassHz, 0.45 * this.sr) / this.sr);
      const w = 2 * PI * hz / this.sr;
      this.lowpassDelay = Math.atan2(this.pole * Math.sin(w), 1 - this.pole * Math.cos(w)) / w;
    }
    setTuning(hz, bowPosition) {
      const period = this.sr / clamp(hz, 20, this.sr / 12);
      this.bridgeLength = clamp(bowPosition * period, 2.5, period * 0.4);
      this.fingerLength = Math.max(2.5, period - this.bridgeLength - this.lowpassDelay);
      this.betaNow = this.bridgeLength / period;
    }
    process(bowVelocity, bowForce, restDamping) {
      const atBridge = this.toBridge.read(this.bridgeLength);
      const fromFinger = -this.toFinger.read(this.fingerLength);
      this.lp = (1 - this.pole) * atBridge + this.pole * this.lp;
      const fromBridge = -this.loopGain * this.lp;
      const incoming = fromFinger + fromBridge;
      const added = this.friction(bowVelocity, bowForce, incoming) - restDamping * incoming;
      this.toFinger.push(fromBridge + added);
      this.toBridge.push(fromFinger + added);

    }
    friction(vb, k, vh) {

      const canStick = a <= k * MU_S;

      if (disc >= 0) {

      }
      this.sticking = true;          // no slipping solution left: the hair has caught the string
      return want;
    }
  }

  // The cello's body: Chordtroller's violin plate modes scaled to a cello.
  class StringBody {
    constructor(sr) {
      this.sr = sr;
      const MODES = [[275, 14, 0.90, 0], [405, 18, 0.30, 0], [460, 22, 1.10, 0], [540, 22, 1.00, 0], [700, 16, 0.45, 0],
                     [860, 16, 0.40, 0], [1050, 14, 0.45, 0], [1320, 12, 0.40, 0], [1650, 10, 0.40, 1], [2100, 6, 0.60, 1],
                     [2650, 6, 0.70, 1], [3300, 6, 0.45, 1], [4600, 4, 0.22, 1]];
      const low = 0.42, high = 0.62;                 // CELLO: plate modes and the bridge hill
      this.modes = MODES.map(([hz, q, gain, hill]) => {
        hz = Math.min(hz * (hill ? high : low), 0.45 * sr);
        const w = 2 * PI * hz / sr, alpha = Math.sin(w) / (2 * q), a0 = 1 + alpha;
        return { b0: alpha / a0, b2: -alpha / a0, a1: -2 * Math.cos(w) / a0, a2: (1 - alpha) / a0, gain, z1: 0, z2: 0 };
      });

      this.hp = { b0: (1 + cw) * 0.5 / a0, b1: -(1 + cw) / a0, b2: (1 + cw) * 0.5 / a0, a1: -2 * cw / a0, a2: (1 - alpha) / a0, x1: 0, x2: 0, y1: 0, y2: 0 };

    }
    process(x) {
      const h = this.hp;
      const direct = h.b0 * x + h.b1 * h.x1 + h.b2 * h.x2 - h.a1 * h.y1 - h.a2 * h.y2;
      h.x2 = h.x1; h.x1 = x; h.y2 = h.y1; h.y1 = direct;
      let sum = direct * 0.35;
      for (const m of this.modes) {
        const y = m.b0 * x + m.z1;

        m.z2 = m.b2 * x - m.a2 * y;

  }

  const OVERSAMPLE = 2;
  class CelloVoice {
    constructor(sr) { this.sr = sr; this.string = new BowedString(sr * OVERSAMPLE); this.active = false; this.note = -1; this.stamp = 0; }
    start(note, velocity, bright, holdSeconds, stamp) {
      while (note > 79) note -= 12;              // above the cello's reach: an octave down
      const hz = 440 * Math.pow(2, (note - 69) / 12);
      if (!this.active || this.note !== note) this.string.reset();
      this.note = note; this.stamp = stamp; this.active = true;
      const loss = 0.003 * Math.max(1, 200 / hz);              // below 200 Hz the loss per period grows
      this.string.setLosses(hz, loss, Math.min(hz * (8 + 6 * clamp(bright, 0, 1)), 5000));
      this.string.setTuning(hz, 0.1);
      this.vbTarget = 0.07 + 0.15 * clamp(velocity, 0, 1);      // metres a second
      this.vb = this.vb || 0;
      this.bowCoef = 1 - Math.exp(-hz / (6 * this.sr));         // up to speed over about six periods
      this.settle = 0;

      this.holdLeft = Math.round(holdSeconds * this.sr);

    }
    process() {
      if (this.bowing && --this.holdLeft <= 0) this.bowing = false;
      this.vb += ((this.bowing ? this.vbTarget : 0) - this.vb) * this.bowCoef;
      this.settle += (1 - this.settle) * this.settleCoef;
      // force from the speed asked for, not the speed reached; from 0.35 to 0.55 of Schelleng's limit
      const k = this.bowing ? (0.35 + 0.2 * this.settle) * this.vbTarget / (this.string.betaNow * MU_SPAN) : 0;
      let out = 0;
      for (let i = 0; i < OVERSAMPLE; i++) out += this.string.process(this.vb, k, 0);
      out *= 1 / OVERSAMPLE;

      if (!this.bowing && this.level < 2e-4) this.active = false;

    }
  }

  class CelloSection {
    constructor(sr, voices) {
      this.voices = Array.from({ length: voices }, () => new CelloVoice(sr));
      this.body = new StringBody(sr);
      this.dcIn = 0; this.dcOut = 0; this.dcCoef = 1 - 2 * PI * 12 / sr;

    start(note, velocity, bright, hold, stamp) {
      let v = this.voices.find((x) => x.active && x.note === note) || this.voices.find((x) => !x.active);
      if (!v) { v = this.voices[0]; for (const x of this.voices) if (x.stamp < v.stamp) v = x; }
      v.start(note, velocity, bright, hold, stamp);
    }
    allOff() { for (const v of this.voices) { v.bowing = false; v.active = false; v.string.reset(); } }
    process() {
      let sum = 0, any = false;
      for (const v of this.voices) if (v.active) { sum += v.process(); any = true; }
      const y = this.body.process(sum);
      // the loop carries a little DC after a stroke
      this.dcOut = y - this.dcIn + this.dcCoef * this.dcOut; this.dcIn = y;
      return any || Math.abs(this.dcOut) > 1e-6 ? this.dcOut : 0;
    }
  }

  // Juno voices played from the strings: each note is a key held for a while
  // (a third of the ring time), then let go to the release (the rest of it).
  // How hard and how deep a finger plays opens the filter a little.
  class JunoSection {
    constructor(sr, voices) {
      this.sr = sr;
      this.voices = Array.from({ length: voices }, () => new JunoVoice(sr, CLOUD));
      this.hold = new Float32Array(voices); this.cut = new Float32Array(voices);
      this.lfoPhase = 0;
    }
    start(note, velocity, bright, holdSeconds, releaseSeconds, stamp) {
      while (note < 48) note += 12;
      while (note > 91) note -= 12;
      const vs = this.voices;
      let k = vs.findIndex((v) => v.active && v.note === note);
      if (k < 0) k = vs.findIndex((v) => !v.active);
      if (k < 0) { k = 0; for (let i = 1; i < vs.length; i++) if (vs[i].stamp < vs[k].stamp) k = i; }
      vs[k].setRelease(releaseSeconds);
      vs[k].noteOn(note, 0.55 + 0.45 * clamp(velocity, 0, 1), stamp);
      this.hold[k] = holdSeconds * this.sr;
      this.cut[k] = 0.30 + 0.22 * clamp(bright, 0, 1);
    }
    allOff() { for (const v of this.voices) v.noteOff(); }
    process() {
      this.lfoPhase += CLOUD.lfoRate / this.sr; if (this.lfoPhase >= 1) this.lfoPhase -= 1;
      const lfo = Math.sin(2 * PI * this.lfoPhase);

      for (let k = 0; k < this.voices.length; k++) {
        const v = this.voices[k];
        if (!v.active) continue;
        if (v.gateOn && --this.hold[k] <= 0) v.noteOff();
        s += v.process(lfo, this.cut[k], 0.18, 1);
      }
      return s;
    }
  }

  // ---- the ney: a blown reed flute ------------------------------------------------
  // No free ney recordings exist with more than a note or two, so it is made:
  // a soft fundamental with a few weak overtones, breath noise tuned to the same
  // pitch by two resonant bandpasses, and a wide airy hiss over it all, which is
  // most of what makes a ney a ney. Each note is a breath: it swells in over a
  // tenth of a second while the pitch rises into tune from a little below, a
  // vibrato grows once the note has settled, and it fades when the breath ends.
  class Bandpass {
    set(sr, hz, q) {
      const w = 2 * PI * Math.min(hz, 0.45 * sr) / sr, alpha = Math.sin(w) / (2 * q), a0 = 1 + alpha;
      this.b0 = alpha / a0; this.b2 = -alpha / a0; this.a1 = -2 * Math.cos(w) / a0; this.a2 = (1 - alpha) / a0;
      this.z1 = this.z1 || 0; this.z2 = this.z2 || 0;
    }
    process(x) { const y = this.b0 * x + this.z1; this.z1 = -this.a1 * y + this.z2; this.z2 = this.b2 * x - this.a2 * y; return y; }
  }

  class NeyVoice {
    constructor(sr) {
      this.sr = sr; this.active = false; this.note = -1; this.stamp = 0;
      this.bp1 = new Bandpass(); this.bp2 = new Bandpass(); this.hissLp = 0; this.hissHp = 0;
      this.rng = 0x1234567 + Math.floor(Math.random() * 1e6);

    }
    noise() { this.rng ^= this.rng << 13; this.rng ^= this.rng >>> 17; this.rng ^= this.rng << 5; return ((this.rng >>> 0) / 4294967296) * 2 - 1; }
    start(note, velocity, bright, holdSeconds, stamp) {

      while (note > 88) note -= 12;
      this.note = note; this.stamp = stamp; this.active = true;
      this.hz = 440 * Math.pow(2, (note - 69) / 12);
      this.bp1.set(this.sr, this.hz, 9);
      this.bp2.set(this.sr, this.hz * 2, 7);
      this.amp = 0.5 + 0.5 * clamp(velocity, 0, 1);

      this.t = 0; this.hold = holdSeconds; this.env = this.env || 0;
      this.attack = 1 - Math.exp(-1 / (0.09 * this.sr));
      this.release = 1 - Math.exp(-1 / (0.32 * this.sr));
      this.vibPhase = Math.random();
    }
    process() {
      const t = (this.t += 1 / this.sr);
      const blowing = t < this.hold;
      this.env += ((blowing ? 1 : 0) - this.env) * (blowing ? this.attack : this.release);
      if (!blowing && this.env < 1e-4) { this.active = false; this.env = 0; return 0; }
      // into tune from a third of a semitone below, and a vibrato that grows after half a second
      const scoop = -0.35 * Math.exp(-t / 0.08);
      this.vibPhase += 5.1 / this.sr;
      const vib = 0.12 * clamp((t - 0.45) / 0.6, 0, 1) * Math.sin(2 * PI * this.vibPhase);
      const hz = this.hz * Math.pow(2, (scoop + vib) / 12);

      const n = this.noise();
      const pitched = this.bp1.process(n) * 1.6 + this.bp2.process(n) * 0.7;
      // the airy hiss: noise band-limited to roughly 1.5 to 7 kHz
      this.hissLp += 0.45 * (n - this.hissLp);

      const flutter = 1 + 0.06 * Math.sin(2 * PI * this.vibPhase * 0.7 + 1.3);   // the breath is never quite steady
      const breath = (pitched * 0.55 + hiss * 0.35) * this.breathy;
      return (tone * (1 - this.breathy * 0.6) * 0.5 + breath) * this.env * this.amp * flutter;
    }

  class NeySection {
    constructor(sr, voices) { this.voices = Array.from({ length: voices }, () => new NeyVoice(sr)); }
    start(note, velocity, bright, hold, stamp) {
      let v = this.voices.find((x) => x.active && x.note === note) || this.voices.find((x) => !x.active);
      if (!v) { v = this.voices[0]; for (const x of this.voices) if (x.stamp < v.stamp) v = x; }
      v.start(note, velocity, bright, hold, stamp);
    }
    allOff() { for (const v of this.voices) { v.active = false; v.env = 0; } }
    process() { let s = 0; for (const v of this.voices) if (v.active) s += v.process(); return s; }
  }

  // ---- GrassEngine --------------------------------------------------------------
  const STRING_GAIN = 0.38, DRONE_GAIN = 1.1;

  class GrassEngine {
    constructor(sr, pluckVoices = 48) {
      this.sr = sr;

      this.celloGain = 0.46;

      this.juno = new JunoSection(sr, 12);
      this.junoGain = 1.7;

      this.drone = Array.from({ length: 8 }, () => new JunoVoice(sr));
      this.ensemble = new Ensemble(sr);

      this.droneTarget = 0.35; this.droneLevel = 0; this.droneCutoff = 0.42; this.anyDrone = false; this.lfoPhase = 0;
      this.masterTarget = 0.8; this.master = 0.8;

    pluckNote(note, velocity, delaySamples, bright = 1) {

    }

      const len = this.ringSeconds * VOICES[this.voiceIndex].decayScale;
      this.decayCoef = Math.pow(0.001, 1 / Math.max(1, this.sr * len));
      for (const v of this.plucks) if (v.active) v.decayCoef = this.decayCoef;
    }
    startNote(note, vel, bright = 1) {
      if (note < 0 || note > 127) return;
      if (VOICES[this.voiceIndex].synth) {
        const hold = clamp(this.ringSeconds * 0.3, 0.25, 3);
        this.juno.start(note, vel, bright, hold, clamp(this.ringSeconds * 0.5, 0.4, 8), ++this.stamp);
        return;
      }
      if (VOICES[this.voiceIndex].blown) {

        return;
      }
      if (VOICES[this.voiceIndex].bowed) {
        // a bow stroke as long as a third of the ring time asks, then the string rings
        this.cello.start(note, vel, bright, clamp(this.ringSeconds * 0.3, 0.25, 3), ++this.stamp);
        return;
      }

    }

    uNoise: { value: noiseTex },
    uBend: { value: bendA.texture },
    uRipple: { value: rippleRT.texture },
    uRect: { value: new THREE.Vector3(-BEND_SIZE / 2, -BEND_SIZE / 2, BEND_SIZE) },
    uSpacing: { value: 0.08 }, uWidthScale: { value: 1 }, uFieldMin: { value: new THREE.Vector2() },
    uTime: { value: 0 }, uWindDir: { value: new THREE.Vector2(0.8, -0.6).normalize() },
    uWind: { value: 0.45 }, uGustSpeed: { value: 5.0 },
    uMusic: { value: new THREE.Vector3() },
  }, lightUniforms);

  const grassMat = new THREE.ShaderMaterial({
    uniforms: grassUniforms,
    side: THREE.DoubleSide,
    vertexShader: `
      attribute vec2 aCell;
      uniform sampler2D uBend; uniform sampler2D uRipple; uniform vec3 uRect;
      uniform float uSpacing, uWidthScale, uTime, uWind, uGustSpeed;
      uniform vec2 uFieldMin, uWindDir; uniform vec3 uMusic;
      varying float vT; varying float vGust; varying vec3 vLow; varying vec3 vHigh;
      varying vec3 vGlow; varying vec3 vN; varying vec3 vWorld; varying float vSparkle;
      ${COMMON_GLSL}
      vec4 hash42(vec2 p) {
        vec4 p4 = fract(vec4(p.xyxy) * vec4(0.1031, 0.1030, 0.0973, 0.1099));
        p4 += dot(p4, p4.wzxy + 33.33);
        return fract((p4.xxyz + p4.yzzw) * p4.zywx);
      }
      void main() {
        vec4 h = hash42(aCell + 17.0);
        vec4 h2 = hash42(aCell * 1.618 + 3.0);
        vec2 root = uFieldMin + (aCell + h.xy) * uSpacing;
        float lush = lushAt(root);
        float L = mix(0.42, 1.0, lush) * (0.7 + 0.6 * h.z);
        float yaw = h.w * 6.2831853;
        vec2 face = vec2(cos(yaw), sin(yaw));
        float yaw2 = h2.x * 6.2831853;
        vec2 droop = vec2(cos(yaw2), sin(yaw2)) * mix(0.12, 0.6, h.z * h.z);

        vec2 wd = uWindDir, wp = vec2(-wd.y, wd.x);
        vec2 q = root - wd * uTime * uGustSpeed;
        float n = texture2D(uNoise, q / 100.0).a * 0.65 + texture2D(uNoise, q / 32.0 + vec2(0.3, 0.7)).a * 0.35;
        float g = clamp(smoothstep(0.45, 0.78, n) + uMusic.x * 0.5, 0.0, 1.0);
        float ph = h2.y * 6.2831853;
        float flutter = sin(uTime * (2.2 + h.z * 1.6) + ph + dot(root, wd) * 1.3);
        float flutter2 = sin(uTime * (3.1 + h.z) + ph * 1.7);
        vec2 v = droop + wd * uWind * (0.25 + 1.25 * g) + wd * flutter * 0.07 * (0.4 + g) + wp * flutter2 * 0.05;

        vec2 buv = (root - uRect.xy) / uRect.z;
        float inside = step(0.0, buv.x) * step(buv.x, 1.0) * step(0.0, buv.y) * step(buv.y, 1.0);
        vec4 b = texture2D(uBend, buv);
        vec2 push = (b.rg - 0.5) * 2.0 * inside;
        float press = clamp(b.b, 0.0, 1.0) * inside;
        vec4 rp = texture2D(uRipple, buv) * inside;
        v = v * (1.0 - 0.6 * min(length(push), 1.0)) + push * 1.5;
        float vl = max(length(v), 1e-4);
        float a = min(vl + press * 0.9 + rp.a * 0.7, 1.5);
        vec2 dir = v / vl;

        float t = position.y, s = position.x;
        vec3 hd = vec3(dir.x, 0.0, dir.y);
        vec3 P1 = hd * sin(a) * L * 0.18 + vec3(0.0, L * 0.55, 0.0);
        vec3 P2 = hd * sin(a) * L + vec3(0.0, cos(a) * L, 0.0);
        vec3 pos = 2.0 * (1.0 - t) * t * P1 + t * t * P2;
        vec3 tng = normalize(2.0 * (1.0 - t) * P1 + 2.0 * t * (P2 - P1) + vec3(0.0, 1e-4, 0.0));
        vec3 side = vec3(face.x, 0.0, face.y);
        float w = uSpacing * 0.75 * uWidthScale * (0.75 + 0.5 * h2.z);
        pos += side * s * w * pow(1.0 - t, 0.6);
        vN = normalize(mix(normalize(cross(side, tng)), vec3(0.0, 1.0, 0.0), 0.6));
        vec3 world = vec3(root.x, -0.02, root.y) + pos;
        vWorld = world;
        vT = t; vGust = g;
        vLow = grassLow(root);
        vHigh = grassHigh(root) * (0.85 + 0.3 * h2.w);
        vGlow = rp.rgb;
        vSparkle = uMusic.z * step(0.93, fract(h.z * 37.0 + uTime * 0.7));
        gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity, uWarm;
      varying float vT; varying float vGust; varying vec3 vLow; varying vec3 vHigh;
      varying vec3 vGlow; varying vec3 vN; varying vec3 vWorld; varying float vSparkle;
      vec3 tonemap(vec3 x) { x *= 0.62; return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
      void main() {
        vec3 col = mix(vLow, vHigh, smoothstep(0.0, 0.85, vT));
        col *= mix(0.35, 1.0, smoothstep(0.0, 0.55, vT));
        col *= 1.0 + vGust * 0.28 * vT;
        col = mix(col, col * vec3(1.15, 1.0, 0.7), uWarm * vT);
        vec3 n = normalize(gl_FrontFacing ? vN : vN);
        float lam = max(dot(n, uSunDir), 0.0) * 0.6 + 0.4;
        vec3 lit = col * (uAmbient + uSunCol * lam * 1.4) + col * uSunCol * 0.3 * vT;
        lit += vGlow * vT * vT * 0.55 + vec3(1.0, 0.95, 0.8) * vSparkle * vT * vT * 0.8;
        float fog = 1.0 - exp(-uFogDensity * length(vWorld - cameraPosition));
        lit = mix(lit, uFogCol, fog);
        gl_FragColor = vec4(pow(tonemap(lit), vec3(1.0 / 2.2)), 1.0);
      }`,
  });

  const groundMat = new THREE.ShaderMaterial({
    uniforms: Object.assign({ uNoise: { value: noiseTex }, uFieldMin: grassUniforms.uFieldMin, uFieldMax: { value: new THREE.Vector2() } }, lightUniforms),
    vertexShader: "varying vec3 vWorld; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }",
    fragmentShader: `
      uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity; uniform vec2 uFieldMin, uFieldMax;
      varying vec3 vWorld;
      ${COMMON_GLSL}
      void main() {
        vec2 xz = vWorld.xz;
        float n = texture2D(uNoise, xz / 9.0).b;
        vec3 low = grassLow(xz) * (0.8 + 0.4 * n);
        // past the blades the ground takes the colour of their tips
        vec2 outside = max(uFieldMin - xz, xz - uFieldMax);
        float far = smoothstep(-1.0, 3.0, max(outside.x, outside.y));
        vec3 c = mix(low, grassHigh(xz) * 0.6, far);
        vec3 lit = c * (uAmbient + uSunCol * (max(uSunDir.y, 0.0) * 0.6 + 0.4) * 1.6);
        float fog = 1.0 - exp(-uFogDensity * length(vWorld - cameraPosition));
        gl_FragColor = vec4(pow(tonemap(mix(lit, uFogCol, fog)), vec3(1.0 / 2.2)), 1.0);
      }`,
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
  ground.rotation.x = -Math.PI / 2;
  group.add(ground);

  // One blade: a strip from root (y 0) to tip (y 1), x -0.5..0.5 across.
  function bladeGeometry(segments) {
    const pos = [], idx = [];
    for (let k = 0; k < segments; k++) { const t = k / segments; pos.push(-0.5, t, 0, 0.5, t, 0); }
    pos.push(0, 1, 0);
    for (let k = 0; k < segments - 1; k++) { const a = k * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    const last = (segments - 1) * 2;
    idx.push(last, segments * 2, last + 1);
    const g = new THREE.InstancedBufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    return g;
  }

  // The field: a grid of cells covering what every view sees, in a shuffled
  // order, so drawing fewer blades thins the whole meadow evenly. Blades widen
  // as they thin so the meadow stays full.
  const MAX_BLADES = 150000;
  let budget = 70000;
  const bladeGeo = bladeGeometry(4);
  const blades = new THREE.Mesh(bladeGeo, grassMat);
  blades.frustumCulled = false;
  group.add(blades);
  let fieldArea = 1;

  function footprint(view, aspect) {
    const cam = new THREE.PerspectiveCamera(view.fov, aspect, 0.1, 100);
    cam.position.set(...view.pos); cam.lookAt(...view.look); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
    const pts = [];
    for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const p = new THREE.Vector3(x, y, 0.5).unproject(cam).sub(cam.position).normalize();
      const t = p.y < -0.05 ? -cam.position.y / p.y : 40;
      const hit = cam.position.clone().addScaledVector(p, Math.min(t, 40));
      pts.push([clamp(hit.x, -FIELD_LIMIT, FIELD_LIMIT), clamp(hit.z, -FIELD_LIMIT, FIELD_LIMIT)]);
    }
    return pts;
  }

  function buildField() {
    const aspect = window.innerWidth / Math.max(1, window.innerHeight);
    let minX = 1e9, minZ = 1e9, maxX = -1e9, maxZ = -1e9;
    for (const v of VIEWS) for (const [x, z] of footprint(v, aspect)) {
      minX = Math.min(minX, x); maxX = Math.max(maxX, x); minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
    }
    minX -= 1.5; minZ -= 1.5; maxX += 1.5; maxZ += 1.5;
    const w = maxX - minX, d = maxZ - minZ;
    fieldArea = w * d;
    const spacing = Math.sqrt(fieldArea / MAX_BLADES);
    const nx = Math.ceil(w / spacing), nz = Math.ceil(d / spacing);
    const n = nx * nz;
    const cells = new Float32Array(n * 2);
    for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) { const k = (j * nx + i) * 2; cells[k] = i; cells[k + 1] = j; }
    let s = 12345;
    for (let k = n - 1; k > 0; k--) {
      s = (s * 1664525 + 1013904223) >>> 0;
      const r = s % (k + 1);
      const ax = cells[2 * k], az = cells[2 * k + 1];
      cells[2 * k] = cells[2 * r]; cells[2 * k + 1] = cells[2 * r + 1];
      cells[2 * r] = ax; cells[2 * r + 1] = az;
    }
    bladeGeo.setAttribute("aCell", new THREE.InstancedBufferAttribute(cells, 2));
    grassUniforms.uSpacing.value = spacing;
    grassUniforms.uFieldMin.value.set(minX, minZ);
    groundMat.uniforms.uFieldMax.value.set(maxX, maxZ);
    bladeGeo.maxCells = n;
    setBudget(budget);
  }

  function setBudget(b) {
    budget = clamp(Math.round(b), 15000, Math.min(MAX_BLADES, bladeGeo.maxCells || MAX_BLADES));
    bladeGeo.instanceCount = budget;
    grassUniforms.uWidthScale.value = Math.sqrt(MAX_BLADES / budget) * 0.9;
  }

  const bendTouch = bendMat.uniforms.uTouch.value, bendDrag = bendMat.uniforms.uDrag.value;

  // touches: {x, z, radius, press, dx, dz, strength} from the core, one per finger
  function update(dt, touches, time) {
    grassUniforms.uTime.value = time;
    grassUniforms.uMusic.value.copy(music);
    let n = 0;
    for (const t of touches) {
      if (n >= MAX_TOUCH) break;
      bendTouch[n].set(t.x, t.z, t.radius, t.press);
      bendDrag[n].set(t.dx, t.dz, t.strength, 0);
      n++;
    }
    bendMat.uniforms.uCount.value = n;
    bendMat.uniforms.uDecay.value = 1 - Math.exp(-dt / 2.6);
    bendMat.uniforms.uPrev.value = bendA.texture;
    passQuad.material = bendMat;
    renderer.setRenderTarget(bendB);
    renderer.render(passScene, passCam);
    renderer.setRenderTarget(null);
    bendMat.uniforms.uInit.value = 0;
    [bendA, bendB] = [bendB, bendA];
    grassUniforms.uBend.value = bendA.texture;
  }

  // keep the frame rate: fewer blades on a struggling phone, more on a strong one
  let tuned = 0;
  function tune(fps) {
    if (tuned >= 6) return;
    if (fps < 42) { setBudget(budget * 0.7); tuned++; }
    else if (fps > 57 && budget < MAX_BLADES) { setBudget(budget * 1.25); tuned++; }
  }

  return {
    id: "meadow", name: "Äng", group,
    sound: { voice: 1, ring: 3.5, wet: 0.32 },
    touchHeight: GRASS_TOP * 0.8, glowHeight: GRASS_TOP + 0.15,
    resize: buildField, update, tune,
    enter() { bendMat.uniforms.uInit.value = 1; },
    exit() {},
    tap() {},
    pluck(f, col, vel) { burst(f.world, col, vel, "pollen"); },
    stats() { return { blades: budget }; },
  };
})();


// ---- scene: the pond -------------------------------------------------------------
// A still pond seen from above. A sweep leaves a wake, a tap drops a ring and a
// splash, every plucked string sends a ring of its plate's colour across the
// surface. Lily pads and fallen leaves and petals ride the waves and drift from
// the fingers; koi glide over a sandy bottom netted with sunlight, flee from
// taps and come close to a finger that rests on the water.
//
// The waves are a real wave equation on the GPU (height and previous height in
// one half-float texture, a few substeps a frame), so rings spread, cross,
// reflect softly and die away on their own. Where half floats cannot be drawn
// into, the pond keeps its light and its coloured rings but has no waves.
const waterScene = (() => {
  const group = new THREE.Group();
  const SIZE = 36, RES = 320, DX = SIZE / RES;
  const RECT = new THREE.Vector3(-SIZE / 2, -SIZE / 2, SIZE);
  const BOTTOM = -1.1, KOI_DEPTH = -0.32;
  const MAX_IMP = 14;
  const simOK = floatTargets;

  const TONEMAP = "vec3 tonemap(vec3 x) { x *= 0.62; return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }";
  const SIM_GLSL = `
    uniform sampler2D uSim; uniform vec3 uSimRect; uniform float uSimOn;
    vec2 simUv(vec2 xz) { return (xz - uSimRect.xy) / uSimRect.z; }
    float simInside(vec2 uv) { return step(0.0, uv.x) * step(uv.x, 1.0) * step(0.0, uv.y) * step(uv.y, 1.0); }
    float heightAt(vec2 xz) { vec2 uv = simUv(xz); return texture2D(uSim, uv).r * simInside(uv) * uSimOn; }
    vec2 slopeAt(vec2 xz) {
      float e = ${DX.toFixed(5)};
      return vec2(heightAt(xz + vec2(e, 0.0)) - heightAt(xz - vec2(e, 0.0)),
                  heightAt(xz + vec2(0.0, e)) - heightAt(xz - vec2(0.0, e))) / (2.0 * e);
    }
  `;

  // ---- the wave simulation ----
  function simTarget() {
    return new THREE.WebGLRenderTarget(RES, RES, {
      type: THREE.HalfFloatType, format: THREE.RGBAFormat,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false,
    });
  }
  let simA = simOK ? simTarget() : null, simB = simOK ? simTarget() : null;
  const impulses = Array.from({ length: MAX_IMP }, () => new THREE.Vector4());
  const simMat = new THREE.ShaderMaterial({
    vertexShader: PASS_VERT,
    uniforms: {
      uPrev: { value: null }, uTexel: { value: new THREE.Vector2(1 / RES, 1 / RES) },
      uK: { value: 0.045 }, uDamp: { value: 0.9965 }, uInit: { value: 1 },
      uCount: { value: 0 }, uImp: { value: impulses }, uRect: { value: RECT },
    },
    fragmentShader: `
      uniform sampler2D uPrev; uniform vec2 uTexel; uniform float uK, uDamp, uInit;
      uniform int uCount; uniform vec4 uImp[${MAX_IMP}]; uniform vec3 uRect;
      varying vec2 vUv;
      void main() {
        vec4 c = texture2D(uPrev, vUv);
        float h = c.r, hp = c.g;
        float lap = texture2D(uPrev, vUv + vec2(uTexel.x, 0.0)).r + texture2D(uPrev, vUv - vec2(uTexel.x, 0.0)).r
                  + texture2D(uPrev, vUv + vec2(0.0, uTexel.y)).r + texture2D(uPrev, vUv - vec2(0.0, uTexel.y)).r - 4.0 * h;
        float hn = (2.0 * h - hp + uK * lap) * uDamp;
        // the rim swallows waves instead of throwing them back
        float edge = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));
        hn *= mix(0.92, 1.0, smoothstep(0.0, 0.07, edge));
        vec2 w = uRect.xy + vUv * uRect.z;
        for (int i = 0; i < ${MAX_IMP}; i++) {
          if (i >= uCount) break;
          float d = length(w - uImp[i].xy) / uImp[i].z;
          if (d < 1.0) hn += uImp[i].w * (0.5 + 0.5 * cos(d * 3.14159265));
        }
        hn = clamp(hn, -0.6, 0.6);
        gl_FragColor = mix(vec4(hn, h, 0.0, 1.0), vec4(0.0), uInit);
      }`,
  });
  const queued = [];          // one-shot impulses from taps and plucks
  function impulse(x, z, radius, amount) { if (queued.length < MAX_IMP) queued.push([x, z, radius, amount]); }

  const simUniforms = {
    uSim: { value: simA ? simA.texture : null },
    uSimRect: { value: RECT },
    uSimOn: { value: simOK ? 1 : 0 },
  };
  const common = Object.assign({
    uNoise: { value: noiseTex }, uTime: { value: 0 }, uMusic: { value: new THREE.Vector3() },
  }, lightUniforms, simUniforms);

  // ---- the bottom: sand and pebbles under a net of moving light ----
  const bottomMat = new THREE.ShaderMaterial({
    uniforms: common,
    vertexShader: "varying vec3 vWorld; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }",
    fragmentShader: `
      uniform sampler2D uNoise; uniform float uTime;
      uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity;
      varying vec3 vWorld;
      ${SIM_GLSL}
      ${TONEMAP}
      void main() {
        // the waves bend the view of the bottom, as refraction does
        vec2 p = vWorld.xz + slopeAt(vWorld.xz) * 1.4;
        float n = texture2D(uNoise, p / 9.0).b;
        vec3 sand = mix(vec3(0.30, 0.27, 0.19), vec3(0.44, 0.39, 0.28), n);
        float stones = smoothstep(0.62, 0.70, texture2D(uNoise, p / 5.0 + vec2(0.31, 0.77)).r);
        sand = mix(sand, vec3(0.22, 0.22, 0.20) * (0.8 + 0.4 * n), stones);
        float weed = smoothstep(0.58, 0.75, texture2D(uNoise, p / 23.0 + vec2(0.6, 0.2)).g);
        sand = mix(sand, vec3(0.10, 0.20, 0.07), weed * 0.7);
        // caustics: where two drifting noise fields meet, a thin line of light;
        // and where the waves focus the sun, a brighter patch
        vec2 q = p / 6.0;
        float c1 = texture2D(uNoise, q * 0.9 + uTime * vec2(0.010, 0.006)).b;
        float c2 = texture2D(uNoise, q * 1.13 - uTime * vec2(0.008, 0.011) + 0.5).b;
        float caus = (1.0 - smoothstep(0.0, 0.04, abs(c1 - c2))) * smoothstep(0.35, 0.75, texture2D(uNoise, p / 31.0 + uTime * 0.004).g);
        vec2 uv = simUv(vWorld.xz);
        float h = heightAt(vWorld.xz);
        float lapH = heightAt(vWorld.xz + vec2(0.25, 0.0)) + heightAt(vWorld.xz - vec2(0.25, 0.0))
                   + heightAt(vWorld.xz + vec2(0.0, 0.25)) + heightAt(vWorld.xz - vec2(0.0, 0.25)) - 4.0 * h;
        caus = caus * 0.55 + max(-lapH, 0.0) * 9.0;
        vec3 lit = sand * (uAmbient * 0.8 + uSunCol * (0.55 + 0.9 * caus) * max(uSunDir.y, 0.15));
        lit = mix(lit, vec3(0.02, 0.10, 0.10) * (uAmbient + uSunCol * 0.4), 0.48);
        float fog = 1.0 - exp(-uFogDensity * 0.4 * length(vWorld - cameraPosition));
        gl_FragColor = vec4(pow(tonemap(mix(lit, uFogCol, fog)), vec3(1.0 / 2.2)), 1.0);
      }`,
  });
  const bottom = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), bottomMat);
  bottom.rotation.x = -Math.PI / 2;
  bottom.position.y = BOTTOM;
  group.add(bottom);

  // ---- the surface: sky in the ripples, clear where you look straight down ----
  const surfaceMat = new THREE.ShaderMaterial({
    uniforms: Object.assign({ uRipple: { value: rippleRT.texture }, uRippleRect: { value: new THREE.Vector3(-BEND_SIZE / 2, -BEND_SIZE / 2, BEND_SIZE) } }, common),
    transparent: true, depthWrite: false,
    vertexShader: `
      varying vec3 vWorld;
      ${SIM_GLSL}
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        w.y += heightAt(w.xz);
        vWorld = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform sampler2D uNoise; uniform sampler2D uRipple; uniform vec3 uRippleRect;
      uniform float uTime; uniform vec3 uMusic;
      uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity;
      varying vec3 vWorld;
      ${SIM_GLSL}
      ${TONEMAP}
      float ambient(vec2 xz) {
        return texture2D(uNoise, xz / 7.0 + uTime * vec2(0.012, 0.007)).b * 0.6
             + texture2D(uNoise, xz / 2.3 - uTime * vec2(0.020, 0.013)).b * 0.4;
      }
      void main() {
        vec2 xz = vWorld.xz;
        vec2 s = slopeAt(xz);
        float crest = smoothstep(0.015, 0.12, length(s));     // where the simulated waves stand up
        s *= 0.7;                                              // gentler mirrors on steep waves
        // a breath of wind always moves the surface a little, more with the drone
        float e = 0.08, a0 = ambient(xz);
        vec2 amb = vec2(ambient(xz + vec2(e, 0.0)) - a0, ambient(xz + vec2(0.0, e)) - a0) / e;
        s += amb * (0.022 + uMusic.x * 0.04);
        vec3 n = normalize(vec3(-s.x, 1.0, -s.y));
        vec3 V = normalize(cameraPosition - vWorld);
        float fres = 0.02 + 0.98 * pow(1.0 - max(dot(n, V), 0.0), 5.0);
        vec3 R = reflect(-V, n);
        vec3 zenith = uAmbient * vec3(0.55, 0.85, 1.5);
        vec3 sky = mix(uFogCol, zenith, smoothstep(0.0, 0.7, R.y));
        float spec = pow(max(dot(R, uSunDir), 0.0), 420.0);
        vec3 body = vec3(0.008, 0.055, 0.06) * (uAmbient + uSunCol * 0.3);
        vec3 col = mix(body, sky, fres) + uSunCol * spec * 1.6;

        vec2 ruv = (xz - uRippleRect.xy) / uRippleRect.z;
        vec3 glow = texture2D(uRipple, ruv).rgb * simInside(ruv);
        // the plucked strings' colours tint only the wave crests: a sweep plucks a
        // dozen strings, and their rings laid flat over the pond became a pale mat
        col += glow * crest * 0.35;
        float glint = step(0.986, texture2D(uNoise, xz / 1.7 + uTime * vec2(0.05, -0.03)).b) * uMusic.z;

  });
  const surface = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE, 240, 240), surfaceMat);
  surface.rotation.x = -Math.PI / 2;

  // the rest of the pond, beyond the simulated part, flat

  farMat.uniforms = surfaceMat.uniforms;
  const far = new THREE.Mesh(new THREE.RingGeometry(SIZE * 0.5 * Math.SQRT2, 160, 4, 1, Math.PI / 4), farMat);

  // ---- floating things: lily pads, leaves and petals -----------------------

  const FLOAT_VERT = `
    attribute vec4 iPose;      // x, z, rotation, size
    attribute vec4 iLook;      // kind-specific
    varying vec2 vLocal; varying vec4 vLook; varying vec3 vWorld;
    ${SIM_GLSL}
    void main() {

    g.setAttribute("iLook", new THREE.InstancedBufferAttribute(new Float32Array(count * 4), 4).setUsage(THREE.DynamicDrawUsage));
    g.instanceCount = count;

  // a pad: a disc with a notch, flat in xz

  // to ride a wave, and the same shape, so the pad is built here.)

    const pos = [0, 0, 0], idx = [];

  const padMat = new THREE.ShaderMaterial({

      uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity;
      varying vec2 vLocal; varying vec4 vLook; varying vec3 vWorld;

      void main() {

  });

  group.add(pads);

  // a lotus flower: two rings of petals cupped upward, on some of the pads
  function lotusGeometry() {
    const pos = [], col = [];

    uniforms: common, side: THREE.DoubleSide,

      uniform vec3 uSunCol, uAmbient, uFogCol; uniform float uFogDensity;
      varying float vU; varying vec2 vLocal; varying vec4 vLook; varying vec3 vWorld;
      ${TONEMAP}
      void main() {

  });
  const lotus = new THREE.Mesh(lotusGeo, lotusMat);
  lotus.frustumCulled = false;
  group.add(lotus);

  // leaves and petals: a quad each, its shape cut out in the shader
  const bitBase = new THREE.PlaneGeometry(1, 1, 3, 3);
  bitBase.rotateX(-Math.PI / 2);

  const bitMat = new THREE.ShaderMaterial({
    uniforms: common, side: THREE.DoubleSide,
    vertexShader: FLOAT_VERT,
    fragmentShader: `
      uniform vec3 uSunDir, uSunCol, uAmbient, uFogCol; uniform float uFogDensity;
      varying vec2 vLocal; varying vec4 vLook; varying vec3 vWorld;
      ${TONEMAP}
      void main() {

        float v = vLocal.y;

          float hw = 0.42 * pow(sin(3.14159 * u), 0.9);

          c = mix(a, vec3(0.42, 0.25, 0.08), vLook.z * 0.6);

  });

  bits.frustumCulled = false;
  group.add(bits);

  // ---- koi --------------------------------------------------------------------
  // Each fish is a chain of spine joints that follow the head along the path it
  // swims (follow-the-leader), so the whole body curves through a turn as a real
  // spine does. On top of that a swimming wave runs from head to tail, barely at
  // the head and widest at the tail, and the pectoral fins paddle. The mesh is
  // laid out in spine coordinates (s along the body from the snout, 0, to the tail
  // tip, 1; side; up) and placed on the CPU every frame: a few thousand vertices.
  const KOI = 5, JOINTS = 12;
  const KOI_LOOKS = ["kohaku", "kohaku", "showa", "ogon", "tancho"];

  // half-width of the body at s (0 snout .. 0.8 tail root), as a koi: a blunt
  // rounded head, a long deep body, a slim tail root
  function koiWidth(sx) {
    const t = clamp(sx / 0.8, 0, 1);
    return 0.115 * Math.pow(Math.sin(Math.PI * 0.5 * Math.min(t / 0.24, 1)), 0.55) * (1 - 0.82 * smooth(0.42, 1.0, t));

  function koiRest() {
    const S = [], SIDE = [], UP = [], FLAP = [], PART = [], idx = [];
    const vert = (sv, side, up, flap, part) => { S.push(sv); SIDE.push(side); UP.push(up); FLAP.push(flap); PART.push(part); return S.length - 1; };
    // the body: rings round the spine
    const RINGS = 30, AROUND = 16;
    const tip = vert(0, 0, 0.01, 0, 0);
    let prev = null;
    for (let r = 1; r <= RINGS; r++) {
      const sv = 0.8 * r / RINGS, w = koiWidth(sv), h = w * 1.2;
      const ring = [];
      for (let k = 0; k < AROUND; k++) {

      for (let k = 0; k <= 6; k++) {

        edge.push(vert(0.235 + 0.075 * Math.sin(a) + 0.03, side * (w + 0.075 * Math.cos(a) + 0.01), -0.04, 1, 1));

    }

  }
  const REST = koiRest();

  // the coat: a koi's pattern from its variety, laid on the rest pose

    vertexShader: `
      attribute vec3 color;
      varying vec3 vColor; varying vec3 vN; varying vec3 vWorld;

  }

  // ---- the CPU side: where the floaters and fish are ---------------------------
  const rand = (() => { let s = 2024; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); })();
  const view = { minX: -5, maxX: 5, minZ: -8, maxZ: 6 };   // what the camera sees now (the koi stay in it)
  const area = { minX: -8, maxX: 8, minZ: -12, maxZ: 6 };  // what any view sees (the floaters spread over it)

      kind, x: lerp(area.minX, area.maxX, rand()), z: lerp(area.minZ, area.maxZ, rand()),

      size: pad ? 0.38 + rand() * 0.28 : 0.3 + rand() * 0.16,

  for (let i = 0; i < BITS; i++) floaters.push(makeFloater("bit"));
  const padIndex = floaters.filter((f) => f.kind === "pad");
  const bitIndex = floaters.filter((f) => f.kind === "bit");
  const flowerPads = [0, 3, 6, 9, 12, 15];
  padIndex.forEach((p, i) => { padGeo.attributes.iLook.setXYZW(i, ...p.look); });
  bitIndex.forEach((b, i) => { bitGeo.attributes.iLook.setXYZW(i, ...b.look); });
  padGeo.attributes.iLook.needsUpdate = true; bitGeo.attributes.iLook.needsUpdate = true;

  const fish = Array.from({ length: KOI }, (_, i) => {
    const f = {
      x: lerp(view.minX, view.maxX, rand()), z: lerp(view.minZ, view.maxZ, rand()),
      a: rand() * Math.PI * 2, speed: 0.35, turn: 0, phase: rand() * 6, flee: 0, fx: 0, fz: 0,
      length: 0.95 + rand() * 0.4, joints: [],
